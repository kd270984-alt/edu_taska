<!doctype html>

<title>Taska — планировщик задач</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg?v=2">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png?v=2">
<link rel="apple-touch-icon" href="favicon-180.png?v=2">
<meta name="theme-color" content="#3d82e0">

<script>
  /* ЗАГОТОВКА ДОСКИ (skeleton). Основной скрипт — сотни килобайт: разметка панелей приходит первой и рисуется
     сразу, а доска появляется только когда скрипт догрузится и выполнится. Эти доли секунды видно
     как «моргание пустого экрана». Здесь, в самом начале документа, ставим класс — CSS ниже мгновенно рисует
     белое полотно календаря на том же месте, где его через миг нарисует канвас. Снимается в draw() после
     первого настоящего кадра (и по страховочному таймеру). */
  try{
    var _tok = localStorage.getItem('canvas_token');
    // показываем только там, где заготовка совпадёт с настоящей доской: вошедший пользователь и компьютер (на телефоне доски нет)
    if(_tok && window.innerWidth>700) document.documentElement.className += ' booting-cal';
  }catch(e){}
</script>
<style>
  /* Inter лежит внутри продукта (web/fonts) — интернет для шрифта не нужен.
     Файл переменный: одно начертание покрывает все веса. Три набора символов: кириллица и латиница. */
  @font-face{font-family:'Inter';font-style:normal;font-weight:100 900;font-display:swap;src:url(fonts/inter-cyrillic-ext.woff2) format('woff2');unicode-range:U+0460-052F, U+1C80-1C8A, U+20B4, U+2DE0-2DFF, U+A640-A69F, U+FE2E-FE2F}
  @font-face{font-family:'Inter';font-style:normal;font-weight:100 900;font-display:swap;src:url(fonts/inter-cyrillic.woff2) format('woff2');unicode-range:U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116}
  @font-face{font-family:'Inter';font-style:normal;font-weight:100 900;font-display:swap;src:url(fonts/inter-latin.woff2) format('woff2');unicode-range:U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD}
  :root{--ink:#1d2733;--muted:#7c8794;--line:#e9ebef;--accent:#3d82e0;--danger:#c2384a;
        --page:#edeff3;--wrap:#edeff3;--surface:#fff;--surface2:#f7f8fa;--field:#fff;--border:#e7e9ee;--text:#2c3440;--textdim:#98a1ad;--hover:#f2f4f8;--panel:rgba(255,255,255,.82);
        --brand:#5b9bf0;--brand-deep:#3d82e0;--brand-ink:#33404c;--brand-soft:#eef4fd;
        --black:#15181d;--card-r:22px}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--page);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;color:var(--ink);overflow:hidden}
  /* Оболочка по макету: серая страница, на ней две белые карты — меню слева и рабочая область. */
  #wrap{position:fixed;inset:0;overflow:hidden;background:var(--page);display:flex;gap:13px;padding:13px}
  /* заготовка доски: видна с первых миллисекунд, пока грузится основной скрипт; исчезает после первого настоящего кадра */
  #bootCal{display:none}
  html.booting-cal #bootCal{display:block;position:absolute;inset:6px 10px 10px;background:#fff;border-radius:14px;
    background-image:linear-gradient(to right, transparent 0, transparent calc(100% - 7px), #f4f6f9 calc(100% - 7px));
    background-size:calc(100%/7) 100%;background-repeat:repeat-x}
  html.booting-cal #calHost>canvas{visibility:hidden}
  canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
  canvas.drag{cursor:grabbing}
  .panel{position:absolute;z-index:5}
  .btn{appearance:none;border:1px solid var(--line);background:#fff;color:var(--ink);height:34px;padding:0 14px;border-radius:10px;font:inherit;font-size:12.5px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;box-shadow:0 1px 2px rgba(20,30,45,.05)}
  .btn:hover{background:#f6f7f9}
  .btn.icon{width:32px;padding:0;justify-content:center;font-size:15px}
  .btn:disabled{opacity:.4;cursor:default}
  /* фокус: ОДНА накладка гасит и размывает всё вокруг колонки сегодня (дыра в маске = эта колонка).
     Раньше размывали каждую плашку через ctx.filter='blur()' — замер 31.08.2026: 1120 мс/кадр против 1.1 мс
     на накладке, отсюда и тормоза всего интерфейса в фокусе. ⚠️ blur в цикле отрисовки не возвращать. */
  #focusFx{position:absolute;inset:0;z-index:4;pointer-events:none;display:none;
    background:rgba(18,26,38,.26);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);
    -webkit-mask-image:linear-gradient(#000,#000),var(--hole,linear-gradient(#000,#000));mask-image:linear-gradient(#000,#000),var(--hole,linear-gradient(#000,#000));
    -webkit-mask-size:100% 100%,var(--hw,0px) var(--hh,0px);mask-size:100% 100%,var(--hw,0px) var(--hh,0px);
    -webkit-mask-position:0 0,var(--hx,0px) var(--hy,0px);mask-position:0 0,var(--hx,0px) var(--hy,0px);
    -webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-composite:xor;mask-composite:exclude}
  .dlg.dlg2{width:640px;background:#fff;border-radius:22px;box-shadow:0 22px 64px rgba(20,30,45,.22)}
  .archside .arow{display:grid;grid-template-columns:1fr 84px 130px;gap:8px;align-items:center;padding:9px 10px;border-radius:9px;cursor:pointer;font-size:13px}
  .archside .arow:hover{background:#eef5ff}
  .archside .ahead{font-size:11.5px;color:#8592a1;cursor:pointer;user-select:none;padding:4px 10px}
  .archside .ahead:hover{color:#3b82f6}
  /* контекстное меню (день календаря, профиль) */
  .ctxmenu{position:absolute;z-index:20;background:#fff;border:1px solid var(--line);border-radius:11px;box-shadow:0 12px 32px rgba(20,30,45,.22);padding:5px;min-width:196px;display:none;font-size:13px;user-select:none;max-height:56vh;overflow:auto}
  .ctxmenu.show{display:block}
  .ctxmenu .ci{padding:9px 12px;border-radius:8px;cursor:pointer;display:flex;align-items:center;gap:9px;color:var(--ink);white-space:nowrap}
  .ctxmenu .ci:hover{background:#f2f4f6}
  .ctxmenu .cisep{height:1px;background:var(--line);margin:4px 6px}
  /* карточка задачи — правая панель по макету (растягивается за левый край) */
  /* объект в КОРЗИНЕ: карточка только для чтения. CSS, а не только JS — блоки чек-листа/комментариев/вложений дорисовываются асинхронно уже после открытия. */
  #tsBody.trashro *{pointer-events:none!important;user-select:text}
  #tsBody.trashro #tcRestore{pointer-events:auto!important;opacity:1}
  #tsBody.trashro input,#tsBody.trashro select,#tsBody.trashro textarea,#tsBody.trashro [contenteditable]{background:#f2f4f8;color:#78818d}
  #tsBody.trashro .tlink,#tsBody.trashro .tdel2,#tsBody.trashro .sfmt2,#tsBody.trashro .tfold-body{opacity:.5}
  .tside{position:absolute;z-index:12;top:0;right:0;height:100%;width:780px;min-width:760px;background:#f6f8fc;border-left:1px solid #e3e7ee;box-shadow:-12px 0 36px rgba(20,30,45,.16);visibility:hidden;pointer-events:none;display:flex;flex-direction:column}   /* НЕ используем transform/opacity для показа: это композитные свойства, у части браузеров их переключение не пересчитывается (глюк) — панель уезжает в центр, залипает или становится невидимой. Позиция всегда right:0; показ/скрытие — ТОЛЬКО через visibility (не композитное свойство, не глючит). Без анимации, зато надёжно. */
  .tside.show{visibility:visible;pointer-events:auto}
  .tside.noanim{transition:none}
  .tside .tgrip{position:absolute;left:-4px;top:0;width:9px;height:100%;cursor:ew-resize;z-index:3}
  .tside .tclose,.archside .tclose{position:absolute;top:12px;left:14px;width:34px;height:34px;border-radius:10px;border:1px solid #cfe0fb;background:#eaf2ff;font-size:16px;font-weight:600;color:#3b82f6;cursor:pointer;z-index:2;line-height:1}   /* крестик — В ЛЕВОМ ВЕРХНЕМ углу, компактный */
  .tside .tclose:hover,.archside .tclose:hover{background:#dbe9ff}
  .tside .tbody2{flex:1;overflow:auto;padding:54px 20px 10px 20px}   /* сверху место под ✕ и ← — не наезжают на «Название» */
  .tside .tback{position:absolute;top:12px;left:56px;width:34px;height:34px;border-radius:10px;border:1px solid #e3e7ee;background:#fff;font-size:15px;color:#5b6572;cursor:pointer;z-index:2;display:none}   /* «назад» — правее крестика */
  .tside .tback:hover{background:#f0f3f8}
  .sfmt2{display:flex;gap:2px;margin-bottom:6px;position:sticky;top:0;z-index:7;background:#f6f8fc;border:1px solid #e9edf3;border-radius:10px;padding:4px;margin-left:-5px;margin-right:-5px;box-shadow:0 3px 10px -5px rgba(20,30,45,.28)}
  .tside .sfmt2{top:48px}   /* в карточке — ниже плавающих ✕/←, в модалке создания — у самого верха */
  .sfmt2 button{border:1px solid #e3e7ee;background:#fff;min-width:28px;height:26px;border-radius:7px;cursor:pointer;font-size:12px;color:#3f4854}
  .sfmt2 button:hover{background:#f0f3f8}
  #tcDesc a,#atDesc a{color:#3d82e0;text-decoration:underline;cursor:pointer}   /* кликабельные ссылки в описании задачи */
  .tside .tfoot{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 20px;border-top:1px solid #e9edf3}
  .trow2{display:grid;grid-template-columns:128px 1fr;gap:12px;margin:0 0 13px}
  .trow2>div{min-width:0}   /* иначе grid не сжимает контент (nowrap-строки списка задач растягивали панель) */
  span[title^="Автор"]{min-width:0;overflow:hidden}   /* бейдж автора на узкой панели не должен выталкивать селект */
  span[title^="Автор"]>span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:120px;display:inline-block;vertical-align:middle}
  .trow2>.tlab{display:flex;gap:8px;align-items:center;color:#5b6572;font-size:13px;align-self:start;padding-top:10px;line-height:1.2}
  .tin{width:100%;border:1px solid #e3e7ee;border-radius:11px;padding:10px 12px;font:inherit;font-size:13.5px;background:#fff;color:var(--ink)}
  /* дропдаун меток */
  .csel{position:relative;font-size:13px;user-select:none}
  .cselbtn{width:100%;display:flex;align-items:center;justify-content:space-between;gap:8px;border:1px solid #e3e7ee;border-radius:11px;padding:7px 11px;background:#fff;cursor:pointer;min-height:37px}
  .csel.dis .cselbtn{opacity:.75;cursor:default;background:#f6f8fc}
  .cselmenu{position:absolute;top:calc(100% + 4px);left:0;right:0;z-index:6;background:#fff;border:1px solid #e3e7ee;border-radius:11px;box-shadow:0 10px 28px rgba(20,30,45,.18);padding:5px;display:none}
  .csel.open .cselmenu{display:block}
  .cselopt{padding:5px 6px;border-radius:8px;cursor:pointer}
  .cselopt:hover{background:#f2f5fa}
  .pill{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:20px;font-size:12.5px;font-weight:500;white-space:nowrap}
  .pill .pdot{width:8px;height:8px;border-radius:50%;flex:0 0 auto}
  .pill .x{cursor:pointer;opacity:.6}
  .pill .x:hover{opacity:1}
  .toast{display:flex;align-items:center;gap:12px;background:rgba(32,40,52,.86);backdrop-filter:blur(8px);color:#fff;padding:11px 15px;border-radius:12px;box-shadow:0 12px 32px rgba(20,30,45,.3);font-size:13.5px;transform:translateX(130%);opacity:0;transition:transform .3s cubic-bezier(.2,.8,.2,1),opacity .3s;max-width:360px}
  .toast.in{transform:none;opacity:1}
  .toast .tx{cursor:pointer;opacity:.65;font-size:12px}
  .toast .tx:hover{opacity:1}
  /* тумблер доступа пользователя */
  .uSw{position:relative;display:inline-block;width:38px;height:22px;flex:0 0 auto}
  .uSw input{opacity:0;width:0;height:0}
  .uSw .uSwT{position:absolute;inset:0;background:#cfd6df;border-radius:22px;transition:.18s;cursor:pointer}
  .uSw .uSwT:before{content:"";position:absolute;left:3px;top:3px;width:16px;height:16px;background:#fff;border-radius:50%;transition:.18s}
  .uSw input:checked + .uSwT{background:#22c55e}
  .uSw input:checked + .uSwT:before{transform:translateX(16px)}
  .uSw input:disabled + .uSwT{opacity:.5;cursor:default}
  textarea.tin{min-height:84px;resize:vertical}
  select.tin{appearance:auto}
  /* красивый выбор даты (месяц сеткой) */
  .dpbtn{cursor:pointer;text-align:left;display:flex;align-items:center}
  .datepop{position:fixed;z-index:60;background:#fff;border:1px solid var(--border);border-radius:14px;box-shadow:0 16px 44px rgba(20,30,45,.22);padding:12px;width:288px;display:none;user-select:none}
  .datepop .dphead{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
  .datepop .dpm{font-weight:600;font-size:14px}
  .datepop .dpnav{width:30px;height:30px;border-radius:8px;border:1px solid var(--border);background:#fff;cursor:pointer;font-size:16px;color:var(--ink)}
  .datepop .dpnav:hover{background:var(--hover)}
  .datepop .dpwd{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:4px}
  .datepop .dpwd span{text-align:center;font-size:10.5px;color:var(--textdim)}
  .datepop .dpgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
  .datepop .dpc{height:34px;display:flex;align-items:center;justify-content:center;border-radius:9px;font-size:13.5px;cursor:pointer;color:var(--ink)}
  .datepop .dpc.empty{cursor:default}
  .datepop .dpc:not(.empty):hover{background:var(--hover)}
  .datepop .dpc.today{color:#3b82f6;font-weight:600}
  .datepop .dpc.sel{background:#3b82f6;color:#fff!important}
  .tcard2{background:#fff;border:1px solid #e9edf3;border-radius:13px;padding:12px 14px}
  .tseg{display:flex;gap:8px;flex-wrap:wrap}
  .tseg .sg{display:inline-flex;align-items:center;gap:7px;padding:9px 13px;border-radius:11px;border:1px solid #e3e7ee;background:#fff;font-size:13px;cursor:pointer;color:#3f4854;user-select:none}
  .tseg .sg .dt{width:8px;height:8px;border-radius:50%;flex:0 0 auto}
  .tseg .sg.on{background:#3b82f6;border-color:#3b82f6;color:#fff}
  .tseg .sg.on .dt{background:#fff!important}
  /* сворачиваемый блок в карточке (повторение) — свёрнут по умолчанию */
  .tfold{border:1px solid #e9edf3;border-radius:13px;background:#fff;margin:0 0 13px}
  .tfold>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:11px 14px;font-size:13px;color:#5b6572;user-select:none}
  .tfold>summary::-webkit-details-marker{display:none}
  .tfold>summary:hover{background:#f6f8fc;border-radius:13px}
  .tfold-sub{color:#98a1ad;font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
  .tfold .chev{margin-left:auto;color:#b0b8c4;font-size:18px;line-height:1;transition:transform .15s;flex:0 0 auto}
  .tfold[open] .chev{transform:rotate(90deg)}
  .tfold-body{padding:2px 14px 14px}
  /* поле «Описание» в карточках — заметный полужирный контур, чтобы выделялось */
  .tin-desc{border:2px solid #bcd2f2}
  .tin-desc:focus{border-color:#3d82e0;outline:none}
  /* ЕДИНЫЙ вид описания: что бы ни вставили из Word/Excel/почты — шрифт, размер и цвет наши.
     Размер меняется только нашими классами fs-*; длинные слова/ссылки переносятся, ничего не вылезает за рамку. */
  .tin-desc[contenteditable]{font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:13.5px;line-height:1.45;color:var(--ink);overflow-wrap:anywhere;word-break:normal;max-width:100%;overflow-x:hidden}
  .tin-desc[contenteditable] *{font-family:inherit!important;font-size:inherit!important;line-height:inherit!important;color:inherit!important;background:transparent!important;max-width:100%}
  .tin-desc[contenteditable] .fs-s{font-size:11.5px!important}
  .tin-desc[contenteditable] .fs-m{font-size:13.5px!important}
  .tin-desc[contenteditable] .fs-l{font-size:16px!important}
  .tin-desc[contenteditable] .fs-xl{font-size:19px!important}
  .tin-desc[contenteditable] a{color:#2563eb!important;text-decoration:underline}
  .tin-desc[contenteditable] ul,.tin-desc[contenteditable] ol{margin:4px 0;padding-left:22px}
  .tin-desc[contenteditable] li{margin:1px 0}
  .tin-desc[contenteditable] b,.tin-desc[contenteditable] strong{font-weight:700}
  .tin-desc[contenteditable] s,.tin-desc[contenteditable] strike,.tin-desc[contenteditable] del{text-decoration:line-through}   /* правило выше снимает чужие стили — зачёркивание задаём явно */
  /* чек-лист в описании: пункт/подпункт с флажком; отмеченный зачёркивается и сереет */
  .tin-desc[contenteditable] .cl-item{position:relative;padding:1px 0 1px 24px;margin:1px 0;min-height:19px}
  .tin-desc[contenteditable] .cl-item.cl-sub{margin-left:30px}
  .tin-desc[contenteditable] .cl-box{position:absolute!important;left:2px;top:2px;width:15px;height:15px;border:1.5px solid #a7b0bc;border-radius:4.5px;background:#fff!important;cursor:pointer}
  .tin-desc[contenteditable] .cl-box::after{content:'';position:absolute;left:4px;top:1px;width:4px;height:8px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(43deg);opacity:0}
  .tin-desc[contenteditable] .cl-item.cl-done>.cl-box{background:#3d82e0!important;border-color:#3d82e0}
  .tin-desc[contenteditable] .cl-item.cl-done>.cl-box::after{opacity:1}
  .tin-desc[contenteditable] .cl-item.cl-done{text-decoration:line-through;color:#9aa3ad!important}
  .sfmt2 .fsz{min-width:auto;padding:0 7px;font-size:11.5px;color:#5b6572}
  .sfmt2 .fsz.on{background:#eef4fd;border-color:#a9c9f5;color:#2563eb}
  .sfmt2 .sep{width:1px;background:#e3e7ee;margin:2px 4px;align-self:stretch}
  /* «это часть чужой задачи» — некликабельная плашка над подзадачами */
  .prow{padding:2px 0 10px}
  .pchip{display:inline-flex;align-items:center;gap:7px;padding:8px 12px;border-radius:10px;border:1px solid #d8e4f7;background:#f2f7ff;color:#42556e;font-size:13px;cursor:default;user-select:none}
  .pchip::before{content:'↳';font-size:14px;color:#7ba3d8}
  /* подзадачи — плашки: кружок (пустой = в работе, зелёный = завершена), название, ответственный, дата */
  .subcard{display:flex;align-items:center;gap:9px;padding:8px 10px;margin:0 0 6px;border:1px solid #e3e7ee;border-radius:10px;background:#fff;cursor:pointer;transition:border-color .12s,background .12s}

  .subdot{flex:0 0 auto;width:16px;height:16px;border-radius:50%;border:2px solid #cfd6e0;display:inline-flex;align-items:center;justify-content:center;font-size:10px;line-height:1;color:#fff}
  .subdot.on{background:#22c55e;border-color:#22c55e}
  .subname{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13.5px;color:#2c3440}
  .submeta{flex:0 0 auto;display:inline-flex;align-items:center;gap:6px}
  .subwho{font-size:12.5px;color:#5b6572;white-space:nowrap;max-width:120px;overflow:hidden;text-overflow:ellipsis}
  .subdate{flex:0 0 auto;font-size:12.5px;color:#5b6572;white-space:nowrap}

<script>
"use strict";
// API живёт на том же адресе, что и страница (Caddy проксирует /api и /ws на api:3000).
const API = '';
const esc = s => String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
// Токен всегда имеет вид JWT: три части из латиницы/цифр через точку. Битое значение в localStorage
// (обрывок записи, чужой формат) НЕЛЬЗЯ даже отправить: fetch падает на заголовке ещё до запроса —
// приложение навсегда зависало бы в ожидании связи, не показав экран входа. Такой мусор чистим сразу.
const isJwt = t => /^[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+$/.test(t || '');
let token = localStorage.getItem('canvas_token') || '';
if (token && !isJwt(token)) { token=''; try{ localStorage.removeItem('canvas_token'); }catch(e){} }
let me = null;
let _sessionTok = null;   // токен, под которым УЖЕ поднято приложение (защита от гонок входа и дубля интервалов/WS)
   // единое пространство: пустой boardId → сервер использует дефолтную личную раскладку (досок больше нет)

async function api(path, opts={}) {
  const h = Object.assign({'Content-Type':'application/json'}, opts.headers||{});
  const reqTok = token;   // токен, с которым уходит ИМЕННО ЭТОТ запрос
  if (reqTok && isJwt(reqTok)) h['Authorization'] = 'Bearer ' + reqTok;   // битый токен не отправляем: fetch на нём падает
  const r = await fetch(API + path, Object.assign({cache:'no-store'}, opts, {headers:h}));   // без HTTP-кэша: иначе GET сразу после мутации отдаёт устаревшее
  const data = await r.json().catch(()=>({}));
  // 401 разлогинивает ТОЛЬКО если токен не сменился за время запроса. Иначе устаревший ответ (со старым токеном —
  // напр. от «страничного» start() до перелогина) снёс бы свежую сессию → моргание входа и «случайный» вход.
  if (r.status === 401) { if (token === reqTok) logout('Сессия истекла — войдите ещё раз.'); throw new Error('unauthorized'); }
  if (!r.ok || data.ok === false) throw new Error(data.error || ('HTTP '+r.status));
  return data;
}

/* ---------- login ---------- */
const loginEl = document.getElementById('login');
// ВХОД. Раньше здесь любая ошибка (обрыв сети, таймаут, 502 в секунды рестарта API) показывалась как
// «Неверный email или пароль» — человек видел отказ с ВЕРНЫМ паролем и вводил заново, пока не «повезёт».
// Теперь реальный отказ (401) отличаем от проблем со связью, а связь пробуем сами — до 3 попыток.
let _loggingIn=false;
async function doLogin() {
  if(_loggingIn) return;                                        // защита от двойного клика/Enter
  const email = document.getElementById('lEmail').value.trim();
  const pass = document.getElementById('lPass').value;
  const err = document.getElementById('lErr'), btn = document.getElementById('lBtn');
  const say=(text,neutral)=>{ err.textContent=text; err.style.color=neutral?'var(--muted)':'var(--danger)'; };
  say('');
  // Страницу открыли как файл с диска (file://) — сервера за ней нет, и любой вход упрётся в «нет связи».
  // Люди так делают: двойной щелчок по index.html. Говорим прямо, куда идти.
  if(location.protocol==='file:'){ say('Страница открыта как файл. Откройте Таску по адресу сервера — например http://127.0.0.1:8088'); return; }
  if(!email||!pass){ say('Введите логин и пароль'); return; }
  _loggingIn=true; const btnTxt=btn?btn.textContent:''; if(btn){ btn.disabled=true; btn.textContent='Вхожу…'; }
  const ATT=3; let lastKind='';
  for(let a=1;a<=ATT;a++){
    let kind='ok', d=null;
    try{
      const ac=new AbortController(), tm=setTimeout(()=>ac.abort(), 20000);   // без таймаута запрос мог висеть минутами
      let r;
      try{ r=await fetch(API+'/api/auth/login',{method:'POST',cache:'no-store',headers:{'Content-Type':'application/json'},
             body:JSON.stringify({email,password:pass}),signal:ac.signal}); }
      finally{ clearTimeout(tm); }
      if(r.status===401){ kind='bad'; d=await r.json().catch(()=>null); }       // сервер ответил: пара логин+пароль неверна (d.reason — что именно)
      else if(!r.ok) kind='srv';                                // 5xx/502/504 — сервер жив, но ответить не смог
      else { d=await r.json().catch(()=>null); if(!d||!d.token) kind='srv'; }
    }catch(e){ kind='net'; }                                    // обрыв связи, TLS, таймаут, DNS
    if(kind==='ok'){
      token=d.token; me=d.user; localStorage.setItem('canvas_token', token);
      try{ localStorage.setItem('canvas_email', d.user&&d.user.email||email); }catch(e){}   // подставим в следующий раз: логин никто не должен вспоминать наизусть
      say(''); if(btn){ btn.disabled=false; btn.textContent=btnTxt; } _loggingIn=false;
      loginEl.classList.add('hidden'); start(); return;
    }
    // ЧЕСТНАЯ ПРИЧИНА ОТКАЗА. «Неверный email или пароль» на несуществующий логин — главная ловушка:
    // человек с ВЕРНЫМ паролем думает, что сломался пароль, и бьётся в дверь.
    if(kind==='bad'){
      const reason=(d&&d.reason)||'';
      say(reason==='no_user' ? (email.includes('@')
            ? 'Такого пользователя нет. Проверьте адрес — возможно, опечатка в фамилии.'
            : 'Такого пользователя нет. Введите ПОЛНЫЙ адрес, например фамилия@taska.local')
        : reason==='ambiguous' ? 'Введите полный адрес с доменом — короткое имя подходит нескольким людям.'
        : reason==='inactive'  ? 'Доступ к этому аккаунту отключён — обратитесь к администратору.'
        : 'Пароль не подошёл. Логин верный — проверьте раскладку и Caps Lock.');
      lastKind=''; break; }   // повторять бессмысленно
    lastKind=kind;
    if(a<ATT){ say('Связь оборвалась, пробую снова… ('+a+' из '+(ATT-1)+')', true); await new Promise(z=>setTimeout(z, 900*a)); }
  }
  if(lastKind) say(lastKind==='net'
    ? 'Нет связи с сервером — пароль тут не при чём. Проверьте интернет и нажмите «Войти» снова.'
    : 'Сервер занят и не ответил. Подождите несколько секунд и нажмите «Войти» снова.');
  if(btn){ btn.disabled=false; btn.textContent=btnTxt; }
  _loggingIn=false;
}
document.getElementById('lBtn').onclick = doLogin;
document.getElementById('lPass').addEventListener('keydown', e=>{ if(e.key==='Enter') doLogin(); });
// hard=true — человек сам нажал «Выйти»: гасим и резервную куку сессии.
// Без hard (истёк токен) куку НЕ трогаем: она может быть жива и молча вернёт сессию на следующем запуске.
function logout(msg, hard){
  token=''; me=null; _sessionTok=null;
  try{ localStorage.removeItem('canvas_token'); }catch(e){}
  if(hard){ try{ localStorage.removeItem('canvas_email'); }catch(e){} fetch(API+'/api/auth/logout',{method:'POST',credentials:'include'}).catch(()=>{}); }
  loginEl.classList.remove('hidden');
  prefillLogin();
  const err=document.getElementById('lErr');
  if(err){ err.textContent=msg||''; err.style.color=msg?'var(--muted)':'var(--danger)'; }   // «сессия истекла» — не ошибка человека, не красным
}
// подставляем последний успешный логин: вспоминать его наизусть никто не должен
function prefillLogin(){ try{ const e=localStorage.getItem('canvas_email'); const el=document.getElementById('lEmail');
  if(e&&el&&!el.value){ el.value=e; const p=document.getElementById('lPass'); if(p) setTimeout(()=>p.focus(),50); } }catch(e){} }
// аватар-меню: профиль / пользователи (админ) / выйти
const firstWord=n=>String(n||'').trim().split(/\s+/)[0]||'';
// Ролей ровно две (решение владельца 20.09.2026). В базе живут старые значения manager/viewer —
// показываем их как «Пользователь», и если администратор сохранит карточку, они станут member.
const ROLE2=[['admin','Админ'],['member','Пользователь']];
const roleOf=r=>(r==='admin'?'admin':'member');
// Выбор человека — списком «аватар + имя» (просьба владельца). Один helper на все места:
// карточка задачи, карточка создания, соисполнители. Меню — то же контекстное, что и везде.

// Логин и пароль — только латиница, цифры и обычные знаки. Русские буквы в них оборачиваются бедой:
// человек набирает пароль в русской раскладке, а потом не может войти с другого устройства и не понимает почему.
const LATIN_ONLY=/^[\x21-\x7e]+$/;
const latinBad=v=>!!v && !LATIN_ONLY.test(v);
// Настройки интерфейса на человека. Пишем не чаще раза в секунду: тянуть за ручку — это десятки событий.
let _setTimer=null, _setPatch={};
// Настройки приходят от сервера вместе с «кто я» — это позже разбора скрипта, поэтому применяем отдельно.
function applyMySettings(){
  const st=(me&&me.settings)||{};
  if(st.taskw){ const w=Math.max(TASKW_MIN, +st.taskw||0);   // старая сохранённая ширина могла быть уже минимума

}
function saveMySetting(key, val){
  if(!me) return;
  me.settings=Object.assign({}, me.settings||{}, {[key]:val});
  _setPatch[key]=val;
  if(_setTimer) clearTimeout(_setTimer);
  _setTimer=setTimeout(async()=>{ _setTimer=null; const patch=_setPatch; _setPatch={};
    try{ await api('/api/users/'+me.id,{method:'PATCH',body:JSON.stringify({settings:Object.assign({}, me.settings||{}, patch)})}); }
    catch(e){}   // не достучались — вид всё равно запомнен в браузере, повторим при следующем изменении
  }, 900);
}

// Аватар с именем — это кнопка профиля: одно нажатие, без промежуточного меню (правка 20.09.2026, п.4).
// «Выйти» переехал ВНУТРЬ карточки профиля — там же, где пароль и аватар.

/* ---------- canvas engine ---------- */
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let W=0,H=0,DPR=1;
function resize(){ DPR=Math.min(devicePixelRatio||1,2.5); W=cv.clientWidth; H=cv.clientHeight; cv.width=Math.round(W*DPR); cv.height=Math.round(H*DPR); ctx.setTransform(DPR,0,0,DPR,0,0);
  try{ applyUiDensity();   // перетащили окно на другой монитор или изменили его размер — плотность пересчитывается
       }catch(e){}

const PALETTE = {
  gray:{f:'#b9cad7',s:'#7d97a8'}, green:{f:'#bfe6c8',s:'#5fb079'}, blue:{f:'#9fd3e0',s:'#5ba6b8'},
  purple:{f:'#d2cbf0',s:'#9588d6'}, pink:{f:'#f4b7be',s:'#d97884'}, orange:{f:'#f29021',s:'#c06d05'},
  red:{f:'#f3b3ab',s:'#d9695c'}, yellow:{f:'#f2dd9a',s:'#c9a83c'}, teal:{f:'#a8dfd3',s:'#4fae9a'},
  indigo:{f:'#b9c2f2',s:'#6e7fd6'}, lime:{f:'#d4e8a4',s:'#93b53c'}, cyan:{f:'#aadeee',s:'#4aa7c4'},
  brown:{f:'#d9c3ab',s:'#a37952'}, rose:{f:'#f3c0dc',s:'#d072ab'}, slate:{f:'#c4c9d4',s:'#8791a3'}
};   // 15 цветов (доски/метки)
const PKEYS = Object.keys(PALETTE);
const view = {x:0,y:0,zoom:0.6};
// свой confirm по центру в стиле карточек (вместо браузерного с «Подтвердите действие…»)
// тост-уведомление: выезжает справа снизу, авто-исчезает через ~2.4с, есть ✕
function showToast(text, ms){
  let host=document.getElementById('toastHost');
  if(!host){ host=document.createElement('div'); host.id='toastHost'; host.style.cssText='position:fixed;right:18px;bottom:18px;z-index:80;display:flex;flex-direction:column;gap:10px;align-items:flex-end;pointer-events:none'; document.body.appendChild(host); }
  const el=document.createElement('div'); el.className='toast'; el.style.pointerEvents='auto';
  el.innerHTML='<span>'+esc(text)+'</span><span class="tx" title="Закрыть">✕</span>';
  host.appendChild(el);
  requestAnimationFrame(()=>el.classList.add('in'));
  const kill=()=>{ el.classList.remove('in'); setTimeout(()=>el.remove(),280); };
  const tm=setTimeout(kill, ms||2400);
  el.querySelector('.tx').onclick=()=>{ clearTimeout(tm); kill(); };
}
// следующая дата по циклу повторения (abs-день) после fromAbs
function daysInMonth(y,m){ return new Date(Date.UTC(y,m+1,0)).getUTCDate(); }
function nextRecurDate(rec, fromAbs){ const type=rec.recurrence_type;
  if(type==='daily') return fromAbs+1;
  if(type==='weekly'){ const days=(rec.recurrence_days||[]).map(Number); if(!days.length) return fromAbs+7;
    for(let i=1;i<=7;i++){ const a=fromAbs+i, wd=((dateOfAbs(a).getUTCDay()+6)%7)+1; if(days.includes(wd)) return a; } return fromAbs+7; }
  if(type==='monthly'){ const dom=+rec.recurrence_day_of_month||1; const d=dateOfAbs(fromAbs); let y=d.getUTCFullYear(), m=d.getUTCMonth();
    let cand=Math.round(Date.UTC(y,m,Math.min(dom,daysInMonth(y,m)))/DAY_MS);
    if(cand<=fromAbs){ m++; if(m>11){ m=0; y++; } cand=Math.round(Date.UTC(y,m,Math.min(dom,daysInMonth(y,m)))/DAY_MS); }
    return cand; }
  if(type==='yearly'){ const [dd,mm]=String(rec.recurrence_date||'').split('.').map(Number); if(!dd||!mm) return fromAbs+365;
    const d=dateOfAbs(fromAbs); let y=d.getUTCFullYear();
    const mk=(yy)=>Math.round(Date.UTC(yy,mm-1,Math.min(dd,daysInMonth(yy,mm-1)))/DAY_MS);   // 29 фев в невисокосный → 28 фев (кламп на последний день месяца)
    let cand=mk(y); if(cand<=fromAbs) cand=mk(y+1); return cand; }
  return fromAbs+1;
}
function fmtRuDate(abs){ const d=dateOfAbs(abs); return String(d.getUTCDate()).padStart(2,'0')+'.'+String(d.getUTCMonth()+1).padStart(2,'0')+'.'+d.getUTCFullYear(); }
// «Дата года»: два выпадающих списка (число + месяц), хранится строкой 'ДД.ММ'
const MONTHS_RU=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
function yearlyPicker(pref, cur){ const parts=String(cur||'').split('.').map(Number), cd=parts[0]||0, cm=parts[1]||0;
  let dOpts='<option value="">число</option>'; for(let i=1;i<=31;i++) dOpts+='<option value="'+i+'"'+(cd===i?' selected':'')+'>'+i+'</option>';

      rr(L+3*uz, T+4*uz, bw, chei-8*uz, bw/2); ctx.fillStyle=acc; ctx.fill(); }
    const tgcs=tagColorsOf(t), cy=cs.y;
    ctx.textBaseline='middle'; ctx.textAlign='left';
    // Сколько места есть и что в него влезет. Важность: название → время → метки → стрелка подзадачи.
    // Узкая колонка (вид «2 недели») раньше рисовала всё подряд, и время с точками налезали на название.
    // ⚠️ СТРЕЛКА ПОДЗАДАЧИ СТОИТ ПОД ВРЕМЕНЕМ, А НЕ ПЕРЕД НАЗВАНИЕМ (правка владельца 20.09.2026, п.8):
    //    левая колонка — это max(ширина времени, ширина стрелки), а не их сумма. Названию достаётся
    //    всё остальное — ради этого же ужаты отступы и кегль времени (п.9).
    const x0=L+(acc?padIn+3.5*uz:padIn), total=(L+cwid-padIn)-x0;
    const dotR=Math.max(2.4,3.2*uz), dotsW=tgcs.length?tgcs.length*(dotR*2+2.5*uz):0;
    const grr=Math.max(4.2,5.4*uz), doneW=done?grr*2+3.5*uz:0;
    const subR=Math.max(3,4*uz), subW=t.parent_id?subR*2+4*uz:0;
    const tmStr=t.due_time?String(t.due_time).slice(0,5):'';
    const TMF='600 '+Math.max(7,8.6*uz|0)+'px '+FONT;
    ctx.font=TMF;
    const tmW=tmStr?(ctx.measureText(tmStr).width+4*uz):0;
    const MINNAME=Math.max(26, 30*uz);
    let showDots=dotsW>0, showSub=subW>0, showTime=tmW>0;
    if(showDots && total-doneW-subW-tmW-dotsW < MINNAME) showDots=false;
    if(showSub  && total-doneW-subW-tmW-(showDots?dotsW:0) < MINNAME) showSub=false;
    if(showTime && total-doneW-(showSub?subW:0)-tmW-(showDots?dotsW:0) < MINNAME) showTime=false;
    let rx=L+cwid-padIn;
    if(showDots) for(let gi=tgcs.length-1;gi>=0;gi--){ rx-=dotR;
      ctx.beginPath(); ctx.arc(rx,cy,dotR,0,7); ctx.fillStyle=tgcs[gi]; ctx.fill(); rx-=dotR+2.5*uz; }
    let tx=x0;
    if(done){   // завершённая: зелёная галочка в кружке
      const gcx=tx+grr;
      ctx.beginPath(); ctx.arc(gcx,cy,grr,0,7); ctx.fillStyle='#22c55e'; ctx.fill();
      ctx.strokeStyle='#fff'; ctx.lineWidth=Math.max(1,1.3*uz); ctx.lineCap='round'; ctx.lineJoin='round';
      ctx.beginPath(); ctx.moveTo(gcx-grr*0.42,cy); ctx.lineTo(gcx-grr*0.08,cy+grr*0.36); ctx.lineTo(gcx+grr*0.45,cy-grr*0.35); ctx.stroke();
      tx=gcx+grr+3.5*uz;
    }
    // ⚠️ Порядок в строке: [галочка] [стрелка подзадачи] [время] [название] … [метки].
    //    20.09.2026 пробовали ставить стрелку ПОД временем — владелец вернул как было.
    if(showSub){ drawSubIcon(tx+subR, cy, subR, done?'#b6bdc6':'#9aa3ad'); tx+=subW; }
    if(showTime){ const tc=done?'#9aa3ad':(timePassed(t)?'#e5484d':'#3b82f6');
      ctx.fillStyle=tc; ctx.font=TMF; ctx.fillText(tmStr, tx, cy); tx+=tmW; }
    ctx.fillStyle=done?'#9aa3ad':'#2b3440'; ctx.font=Math.max(7,9.2*uz|0)+'px '+FONT;
    const nameW=rx-tx-2.5*uz;
    if(nameW>6) ctx.fillText(clip(t.name, nameW), tx, cy);
    ctx.restore();
  }
  ctx.restore();
}

// пикер месяца: клик по «месяц год» → список, выбор плавно перематывает к 1-му числу
function openMonthPicker(cx,cy){
  const MOF=['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
  const t0=dateOfAbs(todayAbs()); const items=[];
  for(let i=0;i<18;i++){ const d=new Date(Date.UTC(t0.getUTCFullYear(), t0.getUTCMonth()+i, 1));   // первым — текущий месяц, дальше 18 месяцев вперёд
    const abs=Math.round(d.getTime()/DAY_MS);
    items.push({label:MOF[d.getUTCMonth()]+' '+d.getUTCFullYear(), act:()=>{ dayScrollTarget=clampDay(abs); }}); }
  showCtx(cx,cy,items);
}
function hitCalendarCard(sx,sy){ const z=view.zoom, D0=Math.floor(dayScroll)-1, D1=Math.floor(dayScroll)+calDays+1;
  if((SLOTH-CARD_GAP)*z < 16*UIK) return null;   // названия карточек скрыты (мелкий зум) → перетаскивание/клик карточек заблокированы
  for(const t of allTasks){ if(t._abs==null||t._abs<D0||t._abs>D1) continue; const cw=cardWorld(t);
    if(cw.x<cal.x||cw.x>cal.x+cal.w) continue;   // колонка вне видимой рамки календаря (закадровые пред/след дни) — не даём хватать «из невидимого поля»
    if(cw.y+cw.h/2>cal.y+cal.h-2||cw.y-cw.h/2<cal.y+HEADH+2) continue;
    const s=w2s(cw.x,cw.y), hw=cw.w*z/2, hh=cw.h*z/2; if(hh<5) continue;
    if(sx>=s.x-hw&&sx<=s.x+hw&&sy>=s.y-hh&&sy<=s.y+hh) return t; }
  return null;
}
function drawBoard(){ drawCalendar(); }
function hitBoardCard(sx,sy){ return hitCalendarCard(sx,sy); }
// стопка карточек под курсором при групповом переносе
function drawDragCards(){
  if(!dragCards) return; const z=view.zoom;
  const day=dayFromWorldX(dragCards.wx), colX=(colLeftOf(day)-view.x)*z+W/2;
  ctx.save();
  ctx.fillStyle='rgba(61,130,224,.12)';   // подсветка дня-приёмника
  ctx.fillRect(colX,(cal.y-view.y)*z+H/2+HEADH*z,colWOf(day)*z,(cal.h-HEADH)*z);
  const s=w2s(dragCards.wx,dragCards.wy), cw=(colWOf(day)-14)*z, ch=(SLOTH-CARD_GAP)*z, n=Math.min(3,dragCards.list.length);
  for(let i=n-1;i>=0;i--){   // «стопка»: три плашки со сдвигом
    const dx=i*4*z, dy=i*4*z;
    rr(s.x-cw/2+dx, s.y-ch/2+dy, cw, ch, 6*z*UIK);

    ctx.lineWidth=Math.max(1.2,1.6*z*UIK); ctx.strokeStyle='#3d82e0'; ctx.stroke(); }
  ctx.fillStyle='#2b3440'; ctx.font='600 '+Math.max(9,10.5*z*UIK|0)+'px '+FONT; ctx.textAlign='left'; ctx.textBaseline='middle';
  ctx.fillText(dragCards.list.length+' задач', s.x-cw/2+8*z, s.y);

function drawDragCard(){ if(!dragCard||dragCard._dragWX==null) return; const z=view.zoom; ctx.save();

  if(inCal(dragCard._dragWX,dragCard._dragWY)){ const day=dayFromWorldX(dragCard._dragWX), colX=(colLeftOf(day)-view.x)*z+W/2; ctx.fillStyle='rgba(61,130,224,.12)'; ctx.fillRect(colX,(cal.y-view.y)*z+H/2+HEADH*z,colWOf(day)*z,(cal.h-HEADH)*z); }
  const bw=colWOf(dayFromWorldX(dragCard._dragWX)), s=w2s(dragCard._dragWX,dragCard._dragWY), cw=(bw-14)*z, ch=(SLOTH-CARD_GAP)*z;
  rr(s.x-cw/2,s.y-ch/2,cw,ch,6*z*UIK); ctx.fillStyle='#fff'; ctx.fill(); ctx.lineWidth=Math.max(1.4,2*z*UIK); ctx.strokeStyle='#22c55e'; ctx.stroke();

function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function clip(t,maxPx){ if(ctx.measureText(t).width<=maxPx) return t; while(t.length>1 && ctx.measureText(t+'…').width>maxPx) t=t.slice(0,-1); return t+'…'; }

let down=null, moved=false, dragCard=null, calScroll=false, yearZoneClick=false, plusZoneClick=null;
/* ---------- множественное выделение (Shift+ЛКМ — рамка) и групповое перетаскивание ---------- */
let selRect=null;        // рамка выделения (экранные координаты), пока тянем с Shift
/* ---------- МАССОВОЕ ВЫДЕЛЕНИЕ КАРТОЧЕК В КАЛЕНДАРЕ (Shift + рамка) ----------
   Правило: выделять можно только в ОДНОМ столбце. Если рамка задела несколько дней,
   выделение достаётся столбцу, с которого рамку начали; но если по соседнему столбцу площадь захвата
   больше — берётся он (столбцы одинаковой высоты, поэтому площадь сравниваем по ширине пересечения).
   Дальше группу можно перетащить в другой день — дата меняется у всех разом, Ctrl+Z возвращает. */
let selCards=new Set();  // id выделенных карточек календаря
let selDay=null;         // день, в котором сделано выделение
let dragCards=null;      // групповое перетаскивание карточек: {list:[задачи], wx, wy}
function clearCardSel(){ if(selCards.size){ selCards=new Set(); selDay=null; } }
// какому столбцу достаётся выделение
function pickSelDay(A,B,startWx){   // какому столбцу достаётся выделение рамкой
  const D0=Math.floor(dayScroll)-1, D1=Math.floor(dayScroll)+calDays+1, hits=[];
  for(let D=D0;D<=D1;D++){ const l=colLeftOf(D), r=l+colWOf(D);
    const ov=Math.min(B.x,r)-Math.max(A.x,l); if(ov>0) hits.push({D, ov}); }
  if(!hits.length) return null;
  const widest=hits.reduce((a,b)=>b.ov>a.ov?b:a, hits[0]);
  const start=hits.find(h=>h.D===clampDay(dayFromWorldX(startWx)));
  return (start && start.ov>=widest.ov) ? start.D : widest.D;   // «первый захваченный», если по нему не меньше
}
function finalizeSelection(){
  const ax=Math.min(selRect.x0,selRect.x1), ay=Math.min(selRect.y0,selRect.y1), bx=Math.max(selRect.x0,selRect.x1), by=Math.max(selRect.y0,selRect.y1);
  const A=s2w(ax,ay), B=s2w(bx,by);
  // карточки календаря: только в развёрнутом виде и только в одном столбце
  clearCardSel();
  if((A.x<cal.x+cal.w && B.x>cal.x && A.y<cal.y+cal.h && B.y>cal.y)){
    const day=pickSelDay(A,B, s2w(selRect.x0,selRect.y0).x);
    if(day!=null){
      for(const t of allTasks){ if(t._abs!==day || t.archived) continue;
        const cw=cardWorld(t);
        if(cw.y-cw.h/2<cal.y+HEADH+2 || cw.y+cw.h/2>cal.y+cal.h-2) continue;   // скрытые прокруткой не берём
        if(cw.y-cw.h/2>=A.y && cw.y+cw.h/2<=B.y) selCards.add(t.id); }         // карточка ЦЕЛИКОМ в рамке
      if(selCards.size){ selDay=day; }
      else selDay=null;
    }
  }
}
function drawSelection(){
  if(selCards.size){   // выделенные карточки — синяя рамка вокруг плашки
    ctx.save(); ctx.setLineDash([5,4]); ctx.lineWidth=Math.max(1.4,1.8*view.zoom*UIK); ctx.strokeStyle='rgba(61,130,224,.9)';
    for(const t of allTasks){ if(!selCards.has(t.id)||t._abs==null) continue;
      const cw=cardWorld(t); if(cw.y-cw.h/2<cal.y+HEADH+2 || cw.y+cw.h/2>cal.y+cal.h-2) continue;
      const cs=w2s(cw.x,cw.y), z=view.zoom;
      rr(cs.x-cw.w*z/2-2, cs.y-cw.h*z/2-2, cw.w*z+4, cw.h*z+4, 8*z*UIK); ctx.stroke(); }
    ctx.restore(); }
  if(selRect){ const x=Math.min(selRect.x0,selRect.x1), y=Math.min(selRect.y0,selRect.y1), w=Math.abs(selRect.x1-selRect.x0), h=Math.abs(selRect.y1-selRect.y0);
    ctx.save(); ctx.fillStyle='rgba(61,130,224,.07)'; ctx.fillRect(x,y,w,h); ctx.setLineDash([5,4]); ctx.lineWidth=1.4; ctx.strokeStyle='rgba(61,130,224,.7)'; ctx.strokeRect(x,y,w,h); ctx.restore(); }
}
let FOCUS_MODE=false;   // фокус: колонка сегодня шире и по центру, остальное размыто (БЕЗ зума — только ширина)

   Снимок формы живёт в localStorage ЭТОГО пользователя и восстанавливается при следующем «＋ задача».

   Вложения в черновик не попадают (файл нельзя сохранить в браузере) — о них плашка предупреждает отдельно. */
const DRAFT_TTL_DAYS=7;   // черновик старше недели не всплывает: это уже не «случайно закрыл», а забытое

function saveTaskDraft(){ if(!_draftGrab) return false;
  let d; try{ d=_draftGrab(); }catch(e){ return false; }
  if(d===undefined) return false;   // формы уже нет в DOM — хранилище не трогаем (чужое окно не должно стирать черновик)
  try{ if(d) localStorage.setItem(draftKey(), JSON.stringify(d)); else localStorage.removeItem(draftKey()); }catch(e){}
  return !!d; }

    const d=JSON.parse(raw);
    if(!d||!d.ts||(Date.now()-d.ts)>DRAFT_TTL_DAYS*86400000){ localStorage.removeItem(draftKey()); return null; }
    return d; }catch(e){ return null; } }

(function(){ const g=document.getElementById('tsGrip'); let rs=null;

  // мгновенно, ещё до ответа сервера, и работает, если сеть отвалилась.
  try{ const wsv=+(localStorage.getItem('canvas_taskw')||0); if(wsv) taskSide.style.width=Math.max(TASKW_MIN,wsv)+'px'; }catch(e){}   // мгновенно, до ответа сервера

  [...doc.querySelectorAll('table')].reverse().forEach(tb=>{   // от внутренних к внешним: иначе вложенная таблица дублировала свой текст
    const rows=[...tb.querySelectorAll('tr')].filter(tr=>!_descHidden(tr)).map(tr=>[...tr.querySelectorAll('td,th')]
      .filter(td=>!_descHidden(td)).map(td=>td.textContent.replace(/\s+/g,' ').trim()).filter(Boolean).join(' \u00b7 ')).filter(Boolean);

    el.innerHTML=subs.map(subRow).join('')||'<div class="fld-note">Подзадач пока нет</div>';
    el.querySelectorAll('[data-open]').forEach(x=>x.onclick=async()=>{   // открываем карточку, только если подзадача доступна (своя); чужую — объясняем, а не молчим

  renderSubs();
  _reloadSubsIfOpen=(pid)=>{ if(pid===t.id && mySeq===cardSeq) renderSubs(); };   // создали подзадачу → список в открытой карточке обновляется сам
  // вложения (кнопка + drag&drop, бейдж типа файла, размер)
  async function renderAttach(){ const d=await api('/api/tasks/'+t.id+'/attachments').catch(()=>({attachments:[]})); if(mySeq!==cardSeq) return; const list=d.attachments||[];
    const el=document.getElementById('tcAttach'); if(!el) return;
