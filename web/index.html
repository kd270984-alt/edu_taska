    const extOf=fn=>(String(fn).split('.').pop()||'').toUpperCase().slice(0,4);
    const tileColor=fn=>{ const m={pdf:'#e5484d',doc:'#3b82f6',docx:'#3b82f6',xls:'#2e9e5b',xlsx:'#2e9e5b',csv:'#2e9e5b',png:'#b45ac9',jpg:'#b45ac9',jpeg:'#b45ac9',zip:'#b08948'}; return m[(String(fn).split('.').pop()||'').toLowerCase()]||'#8a939d'; };
    el.innerHTML='<div class="dropzone" id="tcUpBtn">'
      +(list.length?'<div class="dz-files">'+list.map(a=>'<div class="ftile" data-aopen="'+a.id+'" data-afn="'+esc(a.filename)+'" title="'+esc(a.filename)+' — откроется в новой вкладке">'
          +'<span class="ft-b" style="background:'+tileColor(a.filename)+'">'+esc(extOf(a.filename))+'<b>'+fmtSize(a.size_bytes)+'</b>'
            +'<button class="ft-x" data-adel="'+a.id+'" title="Удалить файл">✕</button></span>'
          +'<span class="ft-n">'+esc(a.filename)+'</span></div>').join('')+'</div>':'')
      +'<div class="dz-cta">'+ICO.up+'<b>Загрузить файлы</b>'+(list.length?'':'<span>Можно выбрать несколько файлов или перетащить сюда</span>')+'</div>'
      +'<input type="file" id="tcFile" multiple style="display:none"></div>';
    const upOne=async f=>{ const fd=new FormData(); fd.append('file',f);
      const r=await fetch(API+'/api/tasks/'+t.id+'/attachments',{method:'POST',headers:{Authorization:'Bearer '+token},body:fd});
      if(!r.ok){ const e=await r.json().catch(()=>({})); throw new Error(e.error||('HTTP '+r.status)); } };
    const up=async list=>{ let fs=[...(list||[])].filter(Boolean); if(!fs.length) return;   // грузим пачкой: показываем счётчик и не молчим об ошибках
      const over=fs.filter(tooBig); fs=fs.filter(f=>!tooBig(f));
      if(over.length) showToast('Слишком большой файл (лимит 50 МБ): '+over[0].name+' — '+fmtMb(over[0].size), 8000);
      if(!fs.length) return;
      const btn=document.getElementById('tcUpBtn'); const setTxt=n=>{ const t2=btn&&btn.querySelector('b'); if(t2) t2.textContent=n; };
      if(btn) setTxt('Загружаю 0/'+fs.length+'…');
      let ok=0; const bad=[];
      for(const f of fs){ try{ await upOne(f); ok++; }catch(e){ bad.push(f.name+' — '+e.message); }
        setTxt('Загружаю '+(ok+bad.length)+'/'+fs.length+'…'); }
      if(bad.length) showToast('Не загрузилось ('+bad.length+'): '+bad[0]);
      else if(fs.length>1) showToast('Загружено файлов: '+ok);
      renderAttach(); };
    document.getElementById('tcUpBtn').onclick=ev=>{ if(ev.target.closest('.ftile')) return; document.getElementById('tcFile').click(); };   // tc*, не at* — иначе id конфликтовали с модалкой создания задачи
    document.getElementById('tcFile').onchange=ev=>{ up(ev.target.files); ev.target.value=''; };   // сброс value: тот же файл можно выбрать повторно
    el.ondragover=ev=>{ ev.preventDefault(); }; el.ondrop=ev=>{ ev.preventDefault(); up(ev.dataTransfer.files); };
    taskSide.onpaste=ev=>{ const cd=ev.clipboardData; if(!cd) return;   // вставка из буфера (скриншот/файл) в любой части открытой карточки → во «Вложения»
      const it=[...(cd.items||[])].find(i=>i.kind==='file'); const f=(cd.files&&cd.files[0])||(it?it.getAsFile():null);
      if(f){ ev.preventDefault(); showToast('Вставляю вложение из буфера…'); up([f]); } };   // текст (без файла) не трогаем — обычная вставка
    // ⚠️ Никакого выпадающего меню у файла (правка владельца 20.09.2026, п.11): клик по плитке сразу
    //    открывает файл в новой вкладке, крестик в углу удаляет БЕЗ подтверждения (вернуть — Ctrl+Z нет,
    //    но файл всегда можно приложить заново; лишний вопрос владелец считает помехой).
    el.querySelectorAll('[data-aopen]').forEach(x=>x.onclick=ev=>{ ev.stopPropagation();
      if(ev.target.closest('[data-adel]')) return;
      openAttach(x.dataset.aopen, x.dataset.afn); });
    el.querySelectorAll('[data-adel]').forEach(x=>x.onclick=async ev=>{ ev.stopPropagation(); ev.preventDefault();
      const tile=x.closest('.ftile'); if(tile) tile.style.opacity='.4';
      try{ await api('/api/attachments/'+x.dataset.adel,{method:'DELETE'}); }catch(e){ showToast('Не удалось удалить файл'); }
      renderAttach(); });
  }
  renderAttach();
  _reloadAttachIfOpen=(tid)=>{ if(tid===t.id && mySeq===cardSeq) renderAttach(); };   // фоновая загрузка допишет файлы в открытую карточку
  // КОММЕНТАРИИ (макет): всегда внизу карточки, по умолчанию свёрнуты — видно только количество.
  // Быстрый ввод живёт в подвале; отправка сама разворачивает список, чтобы человек увидел результат.
  let editCmId=null, cmOpen=false, cmAll=false;
  async function renderComments(){ const d=await api('/api/tasks/'+t.id+'/comments').catch(()=>({comments:[]})); if(mySeq!==cardSeq) return; const cms=d.comments||[];
    const el=document.getElementById('tcComments'); if(!el) return;
    const cnt=document.getElementById('cmCountTxt'); if(cnt) cnt.textContent=String(cms.length);
    el.innerHTML='<div class="fld-l cm-head" id="cmHead" title="'+(cmOpen?'Свернуть':'Показать комментарии')+'">'+ic('chat')+'<span>Комментарии</span>'
       +'<span class="fld-cnt">'+cms.length+'</span><span class="cm-chev'+(cmOpen?' on':'')+'">'+ICO.chev+'</span></div>'
      +(cmOpen?('<div class="cm-list">'
        +((!cmAll && cms.length>4)?'<button class="tlink cm-more" style="align-self:center;padding:0 0 2px">Показать все ('+cms.length+')</button>':'')
        +(cms.length?(cmAll?cms:cms.slice(-4)).map(c=>{
          const mine=!!(me&&c.author_id===me.id);   // править и удалять можно только свой комментарий — сервер чужой и не даст
          const body=(editCmId===c.id)
            ? '<input class="tin" data-cmedit="'+c.id+'" value="'+esc(c.text)+'">'
            : '<div class="cm-t">'+esc(c.text)+'</div>';
          return '<div class="cmitem">'+ava(c.author_id,26)
            +'<div class="cm-body"><div class="cm-top"><b>'+esc(c.author_name||'—')+'</b><span class="cm-d">'+fmtWhen(c.created_at)+'</span>'
              +(mine?'<span class="cm-act"><span class="tdel2" data-cmed="'+c.id+'" title="Изменить">'+ICO.pencil+'</span><span class="tdel2" data-cm="'+c.id+'" title="Удалить">'+ICO.trash+'</span></span>':'')
            +'</div>'+body+'</div></div>'; }).join('')
        :'<div class="fld-note">Комментариев пока нет — напишите первый внизу</div>')+'</div>'):'');
    document.getElementById('cmHead').onclick=()=>{ cmOpen=!cmOpen; if(!cmOpen) cmAll=false; renderComments(); };
    { const mb=el.querySelector('.cm-more'); if(mb) mb.onclick=ev=>{ ev.stopPropagation(); cmAll=true; renderComments(); }; }
    if(cmOpen) setTimeout(()=>{ const b=document.getElementById('tsBody'); if(b) b.scrollTo({top:b.scrollHeight, behavior:'smooth'}); }, 30);   // раскрыли — карточка сама пролистывается к последним
    el.querySelectorAll('[data-cm]').forEach(x=>x.onclick=async()=>{ if(!await uiConfirm('Удалить свой комментарий?')) return;
      try{ await api('/api/comments/'+x.dataset.cm,{method:'DELETE'}); }catch(e){ showToast('Не удалось: '+e.message); } renderComments(); });
    el.querySelectorAll('[data-cmed]').forEach(x=>x.onclick=()=>{ editCmId=(editCmId===x.dataset.cmed?null:x.dataset.cmed); renderComments(); });
    el.querySelectorAll('[data-cmedit]').forEach(inp=>{ inp.focus();
      inp.onkeydown=async ev=>{ if(ev.key==='Escape'){ ev.stopPropagation(); editCmId=null; renderComments(); return; }   // stopPropagation: иначе глобальный Esc закрывал/листал карточку
        if(ev.key!=='Enter') return; const v=inp.value.trim(); if(!v) return;
        try{ await api('/api/comments/'+inp.dataset.cmedit,{method:'PATCH',body:JSON.stringify({text:v})}); }catch(e){ showToast('Не удалось: '+e.message); }
        editCmId=null; renderComments(); }; });
  }
  renderComments();
  { // подвал: быстрый комментарий и счётчик, который разворачивает список
    const send=async()=>{ const inp=document.getElementById('cmNew'); if(!inp) return; const v=inp.value.trim(); if(!v) return; inp.value='';
      try{ await api('/api/tasks/'+t.id+'/comments',{method:'POST',body:JSON.stringify({text:v})}); }
      catch(e){ showToast('Комментарий не отправился: '+e.message); }
      cmOpen=true; await renderComments();   // свой комментарий сразу видно среди последних четырёх
    };
    const inp=document.getElementById('cmNew');
    if(inp){ inp.onkeydown=ev=>{ if(ev.key==='Enter'){ ev.preventDefault(); send(); } };
      // начал писать — поле само раскрывается и показывает последние четыре (просьба владельца)
      inp.onfocus=()=>{ if(!cmOpen){ cmOpen=true; renderComments(); } }; }
    const tg=document.getElementById('cmToggle'); if(tg) tg.onclick=async()=>{ cmOpen=!cmOpen; await renderComments();
      if(cmOpen){ const el2=document.getElementById('tcComments'); if(el2) el2.scrollIntoView({block:'end',behavior:'smooth'}); } };
  }
  // ---- автосохранение: любое изменение улетает само, «Сохранить» не нужен ----
  const oldBody={ name:t.name, due_date:t.due_date?String(t.due_date).slice(0,10):null, due_time:t.due_time?String(t.due_time).slice(0,5):null, assignee_id:t.assignee_id||null, description:t.description||'',
    recurrence_type:t.recurrence_type||'none', recurrence_days:t.recurrence_days||null, recurrence_day_of_month:t.recurrence_day_of_month||null, recurrence_date:t.recurrence_date||null };
  const oldCo=[...co], oldTags=[...tagSel];
  let saveTimer=null, savedOnce=false, lastPayload=null;
  function collectBody(){ const rt=repOn?recType:'none';
    return { name:(document.getElementById('tcName').value.trim()||t.name),   // не даём стереть имя в пустую строку
      due_date:document.getElementById('tcDate').value||null,
      due_time:(document.getElementById('tcDate').value?document.getElementById('tcTime').value:'')||null,   // время без даты не сохраняем
      assignee_id:document.getElementById('tcAssignee').value||null,
      description:document.getElementById('tcDesc').innerHTML,
      recurrence_type:rt,
      recurrence_days: rt==='weekly'?[...recDays]:null,
      recurrence_day_of_month: rt==='monthly'?(parseInt(document.getElementById('recDom')&&document.getElementById('recDom').value)||null):null,
      recurrence_date: rt==='yearly'?yearlyVal('recDate'):null }; }
  function setSaveState(s){ const el=document.getElementById('tsSaveState'); if(el) el.textContent=s; }
  let lastSentCo=JSON.stringify(oldCo), lastSentTags=JSON.stringify(oldTags);   // шлём co/tags ТОЛЬКО если менялись
  async function sendPayload(p){ try{
      await api('/api/tasks/'+t.id,{method:'PATCH',body:JSON.stringify(p.body)});
      // ВАЖНО: если сменили ответственного, ты сразу теряешь право на PUT co/tags (строгие права) → шлём их лишь при фактическом изменении, иначе смена ответственного падала бы 403
      const coJs=JSON.stringify(p.co); if(coJs!==lastSentCo){ await api('/api/tasks/'+t.id+'/co-assignees',{method:'PUT',body:JSON.stringify({user_ids:p.co})}); lastSentCo=coJs; }
      const tagsJs=JSON.stringify(p.tags); if(tagsJs!==lastSentTags){ await api('/api/tasks/'+t.id+'/tags',{method:'PUT',body:JSON.stringify({tag_ids:p.tags})}); lastSentTags=tagsJs; }
      lastPayload=p; setSaveState('Сохранено ✓');
      // Правка ДОЕХАЛА до сервера — если к этому моменту уже открыта карточка родителя,
      // обновляем её список подзадач: иначе метка, поставленная в подзадаче, появлялась
      // там только после перезахода (жалоба владельца 20.09.2026).
      if(t.parent_id && typeof _reloadSubsIfOpen==='function') _reloadSubsIfOpen(t.parent_id);
      if(!savedOnce){ savedOnce=true;   // одна undo-запись на сессию карточки: откат к состоянию до открытия
        pushUndo(async()=>{ await api('/api/tasks/'+t.id,{method:'PATCH',body:JSON.stringify(oldBody)}); await api('/api/tasks/'+t.id+'/co-assignees',{method:'PUT',body:JSON.stringify({user_ids:oldCo})}); await api('/api/tasks/'+t.id+'/tags',{method:'PUT',body:JSON.stringify({tag_ids:oldTags})}); await reload(); },
                 async()=>{ const lp=lastPayload; if(!lp) return; await api('/api/tasks/'+t.id,{method:'PATCH',body:JSON.stringify(lp.body)}); await api('/api/tasks/'+t.id+'/co-assignees',{method:'PUT',body:JSON.stringify({user_ids:lp.co})}); await api('/api/tasks/'+t.id+'/tags',{method:'PUT',body:JSON.stringify({tag_ids:lp.tags})}); await reload(); }); }
      await reload();
    }catch(e){ setSaveState('⚠ не сохранилось: '+e.message); } }
  function doSaveNow(){ if(saveTimer){ clearTimeout(saveTimer); saveTimer=null; } if(trashedT) return; if(!document.getElementById('tcName')) return;
    const pl={ body:collectBody(), co:[...co], tags:[...tagSel] }, js=JSON.stringify(pl);
    if(js===lastSentJs){ setSaveState('Сохранено ✓'); return; }   // ничего не менялось — без холостых PATCH/undo/reload
    lastSentJs=js; return sendPayload(pl); }   // обещание нужно flushCard(): «назад» ждёт сохранения
  function scheduleSave(){ if(trashedT) return; setSaveState('Сохранение…'); if(saveTimer) clearTimeout(saveTimer); saveTimer=setTimeout(doSaveNow, 700); }   // задача в корзине — не сохраняем (сервер и так отобьёт 400)
  let lastSentJs=JSON.stringify({ body:collectBody(), co:[...co], tags:[...tagSel] });   // dirty-check: открыть-закрыть без правок не шлёт PATCH
  tsFlush=doSaveNow;   // глобальный хук: закрытие/навигация мгновенно дожимают несохранённое
  tsBody.oninput=e=>{ if(e.target.closest('#tcComments')||e.target.closest('#tcSubs')||e.target.closest('#tcAttach')||e.target.id==='tagEdName') return; scheduleSave(); };      // on* (не addEventListener) — чтобы слушатели не копились между открытиями
  tsBody.onchange=e=>{ if(e.target.closest('#tcComments')||e.target.closest('#tcSubs')||e.target.closest('#tcAttach')||e.target.id==='coSel'||e.target.id==='tagEdName') return; scheduleSave(); };   // те же исключения, что в oninput
  { const db=document.getElementById('tcDel'); if(db) db.onclick=async()=>{
    if(!await uiConfirm(delTaskMsg(t))) return;
    tsFlush=null; if(saveTimer) clearTimeout(saveTimer);   // не «дожимать» автосейв удалённой задачи
    try{ await api('/api/tasks/'+t.id,{method:'DELETE'}); closeTaskSide(); await reload(); pushDeleteUndo(t.id); showToast('Задача в корзине'); }
    catch(e){ showToast('Ошибка: '+e.message); }
  }; }
  // задача в корзине — карточка ТОЛЬКО для чтения (класс trashro гасит и то, что дорисуется позже: чек-лист, комментарии, вложения)
  tsBody.classList.toggle('trashro', trashedT);
  if(trashedT){ tsBody.querySelectorAll('input,select,textarea,button').forEach(el=>{ if(el.id!=='tcRestore') el.disabled=true; });
    tsBody.querySelectorAll('[contenteditable]').forEach(el=>el.setAttribute('contenteditable','false'));
    tsBody.oninput=null; tsBody.onchange=null; }
  { const rb=document.getElementById('tcRestore'); if(rb) rb.onclick=async()=>{   // вернуть из корзины: задача снова активна (с подзадачами, ушедшими вместе с ней)
    tsFlush=null; if(saveTimer) clearTimeout(saveTimer);
    try{ await api('/api/tasks/'+t.id+'/restore',{method:'POST'}); closeTaskSide(); await reload(); showToast('Задача возвращена из архива'); }
    catch(e){ showToast('Ошибка: '+e.message); }
  }; }
}

// карточка создания задачи — по центру экрана (дизайн как у карточки задачи)
async function openAddTask(presetDate, parentId, parentName){
  const mob=isMobileView();   // мобильная карточка — только нужные поля
  const isSub=!!parentId;     // подзадача создаётся тем же диалогом: поля те же, добавляется только родитель
  const dateSet=(typeof presetDate==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(presetDate))?presetDate:isoOfAbs(todayAbs());   // дата обязательна: день, из которого создаём, иначе сегодня
  const users=await getUsers();
  let recType='daily', repOn=false, tagSel=[];
  const recDays=new Set(), co=new Set(), files=[];
  // ЧЕРНОВИК: поднимаем состояние ДО отрисовки полей, иначе метки/соисполнители/чек-лист/повторение нарисуются пустыми.
  // Пресет сильнее черновика: открыли «＋» конкретного дня — это явное намерение сейчас.
  const draft=isSub?null:loadTaskDraft();
  const useDraft=!!draft;
  let recDomInit='', recDateInit=null;
  if(useDraft){
    repOn=!!draft.repOn; recType=draft.recType||'daily';
    (draft.recDays||[]).forEach(d=>recDays.add(d));
    (draft.co||[]).forEach(u=>co.add(u));
    tagSel=(draft.tags||[]).slice(0,2);
    recDomInit=draft.recDom||''; recDateInit=draft.recDate||null;
  }
  const draftDate=useDraft?String(draft.due_date||'').slice(0,10):'';
  const dateInit=dateSet||((draftDate && draftDate>=isoOfAbs(todayAbs()))?draftDate:isoOfAbs(todayAbs()));   // дата обязательна: пресет дня, свежий черновик или сегодня
  const timeInit=(dateInit&&useDraft)?(draft.due_time||''):'';
  const row=(icon,label,inner,id,extra)=>'<div class="fld'+(extra?' '+extra:'')+'"><div class="fld-l">'+ic(icon)+'<span>'+label+'</span></div><div class="fld-b"'+(id?(' id="'+id+'"'):'')+'>'+inner+'</div></div>';
  const timeOpts=(cur)=>{ let o='<option value="">—:—</option>'; for(let h=7;h<=21;h++) for(const m of ['00','30']){ if(h===21&&m==='30') continue; const v=String(h).padStart(2,'0')+':'+m; o+='<option value="'+v+'"'+(cur===v?' selected':'')+'>'+v+'</option>'; } return o; };
  dlg.classList.add('dlg2');
  const draftAgo=useDraft?(()=>{ const d=new Date(draft.ts), n=new Date();
      const hm=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
      return (d.toDateString()===n.toDateString())?('сегодня в '+hm):(d.getDate()+' '+MONTHS_RU[d.getMonth()]+', '+hm); })():'';
  dlg.innerHTML='<div class="tc-kind" style="margin-top:0">'+(isSub?'НОВАЯ ПОДЗАДАЧА':'НОВАЯ ЗАДАЧА')+'</div>'

   +(useDraft?'<div id="atDraftNote" style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:#eef4fd;border:1px solid #cfe0f8;border-radius:10px;padding:9px 12px;margin-bottom:14px;font-size:12.5px;color:#3f4854">'
     +'<span>↩ Восстановлен черновик (сохранён '+draftAgo+')'+(draft.files?' · вложения приложите заново — файлы браузер сохранить не может':'')+'</span>'
     +'<button class="tbtn" id="atDraftClear" style="height:28px;padding:0 10px;font-size:12px;margin-left:auto">Очистить</button></div>':'')
   +'<input class="tc-name" id="atName" placeholder="Название задачи">'
   +'<div class="tc-when">'+datePickerField('atDate',dateInit)+'<span class="tc-time"><select class="tin" id="atTime">'+timeOpts(timeInit)+'</select></span></div>'
   +'<div class="fld-row3">'
     +row('user','Ответственный','<div class="pickwho" id="atAsgPick"><span class="pw-view" id="atAsgView"></span><input type="hidden" id="atAssignee" value="'+esc((me&&me.id)||'')+'"></div>')
     +row('users','Соисполнители','', 'atCo')
     +row('user','Автор','<span class="pw-view">'+(me?ava(me,28)+'<b>'+esc(firstWord(me.name))+'</b>':'<b style="color:#98a1ad;font-weight:500">—</b>')+'</span>')
   +'</div>'
   +row('text','Описание','<div class="sfmt2"><button data-cmd="bold" title="Жирный"><b>Ж</b></button><button data-cmd="italic" title="Курсив"><i>К</i></button><button data-cmd="underline" title="Подчёркнутый"><u>Ч</u></button><button data-cmd="strikeThrough" title="Зачёркнутый"><s>З</s></button><button data-cmd="insertUnorderedList" title="Список">•—</button><button data-clcmd="item" title="Чек-лист: пункт с флажком (Tab — сделать подпунктом, Shift+Tab — вернуть)">☐</button><span class="sep"></span><button class="fsz" data-fs="fs-s" title="Мелкий шрифт">S</button><button class="fsz" data-fs="fs-m" title="Обычный шрифт">M</button><button class="fsz" data-fs="fs-l" title="Крупный шрифт">L</button><button class="fsz" data-fs="fs-xl" title="Очень крупный шрифт">XL</button></div><div class="tin tin-desc" id="atDesc" contenteditable="true" style="min-height:84px"></div>')
   +'<div class="fld-row2">'
     +row('tag','Метки','', 'atTags')
     +row('rep','Повторение','<div id="atRecBody" class="recrow"></div>', null, 'fld-rec')
   +'</div>'
   +row('clip','Вложения','', 'atAttach')   // на телефоне тоже: владельцу нужно прикладывать файлы с телефона
   +'<div class="atfoot"><button class="tbtn" id="atCancel">Отмена</button><button class="tbtn dark" id="atOk">'+(isSub?'Создать подзадачу':'Создать задачу')+'</button></div>';
  modal.classList.add('show');
  setTimeout(()=>{ const i=document.getElementById('atName'); if(i) i.focus(); },60);
  const atSyncAsg=()=>{ const inp=document.getElementById('atAssignee'), v=document.getElementById('atAsgView');
    if(!inp||!v) return; const u=users.find(x=>x.id===inp.value);
    v.innerHTML=(u?ava(u,28)+'<b>'+esc(firstWord(u.name))+'</b>':'<b style="color:#98a1ad;font-weight:500">—</b>')+ICO.chev; };
  atSyncAsg();
  { const pick=document.getElementById('atAsgPick');
    if(pick) pick.onclick=e=>{ e.stopPropagation(); pickPerson(pick, users, u=>{ document.getElementById('atAssignee').value=u.id; atSyncAsg(); }); }; }
  // ЧЕРНОВИК: текстовые поля и ответственный (остальное подняли выше, до отрисовки)
  if(useDraft){
    const nm=document.getElementById('atName'); if(nm) nm.value=draft.name||'';
    const ds=document.getElementById('atDesc'); if(ds && draft.desc) ds.innerHTML=sanitizeDescHtml(draft.desc);   // черновик свой, но чистим и его: в нём могла осесть вставка из чужого письма
    const asg=document.getElementById('atAssignee');
    if(asg && draft.assignee_id && users.some(u=>u.id===draft.assignee_id)){ asg.value=draft.assignee_id; atSyncAsg(); }
    const cl=document.getElementById('atDraftClear');
    if(cl) cl.onclick=()=>{ clearTaskDraft(); closeModal(); openAddTask(presetDate); };   // clearTaskDraft снял _draftGrab → closeModal уже ничего не сохранит
  }
  // снимок формы для черновика. undefined = формы нет (окно закрыто/заменено) → хранилище не трогаем; null = пусто → черновик стираем
  const grabDraft=()=>{
    const nm=document.getElementById('atName'); if(!nm) return undefined;
    const ds=document.getElementById('atDesc'), dt=(document.getElementById('atDate')||{}).value||'';
    const tmEl=document.getElementById('atTime'), asgEl=document.getElementById('atAssignee');
    const name=nm.value.trim(), desc=ds?ds.innerHTML:'', descText=ds?(ds.textContent||'').trim():'';
    const d={ name, desc, due_date:dt, due_time:(dt&&tmEl)?(tmEl.value||''):'',
      assignee_id:asgEl?asgEl.value:'',
      repOn, recType, recDays:[...recDays],
      recDom:(document.getElementById('atRecDom')||{}).value||recDomInit||'',
      recDate:(repOn&&recType==='yearly')?(yearlyVal('atRecDate')||recDateInit):null,
      tags:[...tagSel], co:[...co], files:files.length, ts:Date.now() };
    const empty=!name && !descText && !d.tags.length && !d.co.length && !d.files && !repOn;
    return empty?null:d; };
  _draftGrab=grabDraft;
  let _dTimer=null;
  const draftSoon=()=>{ if(_dTimer) clearTimeout(_dTimer); _dTimer=setTimeout(()=>{ _dTimer=null; saveTaskDraft(); }, 500); };
  ['input','change','click'].forEach(ev=>dlg.addEventListener(ev, draftSoon));   // click — ради чипов меток/соисполнителей, тумблера повторения и чек-листа
  dlg.querySelectorAll('.sfmt2 button').forEach(b=>b.addEventListener('mousedown',ev=>{ ev.preventDefault();
    if(b.dataset.fs){ applyDescSize('atDesc', b.dataset.fs);   // S/M/L/XL — кегль выделенного текста (или всего поля)
      b.closest('.sfmt2').querySelectorAll('.fsz').forEach(x=>x.classList.toggle('on', x===b)); }
    else if(b.dataset.clcmd){ clToggleLine('atDesc'); }
    else { const de0=document.getElementById('atDesc'); de0.focus();
      if(b.dataset.cmd==='insertUnorderedList' && clCaretItem(de0)){ showToast('Внутри чек-листа маркированный список не делается'); return; }
      clTrimSelBox(de0);
      document.execCommand(b.dataset.cmd,false,null); }
    if(typeof scheduleSave==='function') scheduleSave(); }));
  bindDescLinks('atDesc');   // ссылки в описании (выдели слово + вставь URL)
  bindChecklist('atDesc');   // чек-лист: флажки, Enter/Tab/Backspace
  bindDescHistory('atDesc');   // Ctrl+Z/Cmd+Z внутри описания
  // статус (на мобиле поля нет → статус по умолчанию «Ожидает»)
  // время не живёт без даты: селект времени включается только после выбора даты
  bindDatePicker('atDate', ()=>{ const d=document.getElementById('atDate').value, tm=document.getElementById('atTime');
    if(!d){ tm.value=''; tm.disabled=true; tm.title='Сначала выберите дату'; } else { tm.disabled=false; tm.title=''; } });
  // повторение под тумблером
  const WDr=['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
  const REC2=[['daily','Ежедневно'],['weekly','По дням недели'],['monthly','Число месяца'],['yearly','Дата года']];
  function renderRec(){ const body=document.getElementById('atRecBody'); if(!body) return;
    const lab=body.closest('.fld').querySelector('.fld-l');
    lab.innerHTML=ic('rep')+'<span>Повторение</span><span class="tsw2 '+(repOn?'on':'')+'" id="atRepSw" style="margin-left:auto"></span>';
    document.getElementById('atRepSw').onclick=()=>{ repOn=!repOn; if(repOn&&(recType==='none'||!recType)) recType='daily'; renderRec(); };
    if(!repOn){ body.innerHTML='<div class="tin norep">Одноразовая задача</div>'; return; }
    body.innerHTML='<select class="tin recsel" id="atRec">'+REC2.map(([v,l])=>'<option value="'+v+'" '+(recType===v?'selected':'')+'>'+l+'</option>').join('')+'</select><div id="atRecParams" class="recparams"></div>';
    document.getElementById('atRec').onchange=ev=>{ recType=ev.target.value; renderRec(); };
    const p=document.getElementById('atRecParams');
    if(recType==='weekly') p.innerHTML='<div class="tseg wd">'+WDr.map((w,i)=>'<span class="sg '+(recDays.has(i+1)?'on':'')+'" data-rd="'+(i+1)+'">'+w+'</span>').join('')+'</div>';
    else if(recType==='monthly'){ const cur=recDomInit||1; let o='';
      for(let dn=1;dn<=31;dn++) o+='<option value="'+dn+'"'+(String(cur)===String(dn)?' selected':'')+'>'+dn+' число</option>';
      p.innerHTML='<select class="tin" id="atRecDom" title="Если в месяце нет такого числа — перенос на последний день месяца">'+o+'</select>';
      const dm=document.getElementById('atRecDom'); if(dm){ recDomInit=dm.value; dm.onchange=()=>{ recDomInit=dm.value; }; } }
    else if(recType==='yearly'){ p.innerHTML=yearlyPicker('atRecDate', recDateInit);
      p.querySelectorAll('select').forEach(x=>x.onchange=()=>{ recDateInit=yearlyVal('atRecDate')||recDateInit; }); }
    else p.innerHTML='';
    p.querySelectorAll('[data-rd]').forEach(c=>c.onclick=()=>{ const d=+c.dataset.rd; recDays.has(d)?recDays.delete(d):recDays.add(d); renderRec(); }); }
  renderRec();
  // метки: выбор из существующих (до 2)
  function renderTags(){ const el=document.getElementById('atTags'); if(!el) return;
    const tagColor=tg=>(PALETTE[tg.color_key]||PALETTE.gray).s;
    const selChips=tagSel.map(id=>{ const tg=allTags.find(z=>z.id===id); if(!tg) return ''; const c=tagColor(tg);
      return '<span class="pill" style="background:'+hexA(c,0.16)+';color:'+darken(c,0.28)+'"><span class="pdot" style="background:'+c+'"></span><span class="pnm">'+esc(tg.name)+'</span><span class="x" data-rm="'+tg.id+'" title="Убрать">✕</span></span>'; }).join('');
    const rest=allTags.filter(z=>!tagSel.includes(z.id));
    el.innerHTML=selChips+((tagSel.length<2)?'<button class="tagadd" id="atTagAdd" title="Добавить метку">＋</button>':'');
    el.querySelectorAll('[data-rm]').forEach(x=>x.onclick=ev=>{ ev.stopPropagation(); tagSel=tagSel.filter(z=>z!==x.dataset.rm); renderTags(); });
    const add=document.getElementById('atTagAdd');
    if(add) add.onclick=ev=>{ ev.stopPropagation(); const r=add.getBoundingClientRect();
      const items=rest.map(tg=>{ const c=tagColor(tg);
        return {label:'<span class="pill" style="background:'+hexA(c,0.16)+';color:'+darken(c,0.28)+'"><span class="pdot" style="background:'+c+'"></span>'+esc(tg.name)+'</span>',
                act:()=>{ if(tagSel.length>=2) return; tagSel.push(tg.id); renderTags(); }}; });
      if(!items.length) items.push({label:'<span style="color:#98a1ad;font-size:12.5px">меток нет — их заводит администратор во вкладке «Метки»</span>', act:()=>{}});
      showCtx(r.left, r.bottom+6, items); };
  }
  renderTags();
  // соисполнители
  function renderCo(){ const el=document.getElementById('atCo'); if(!el) return;
    const ids=[...co], shown=ids.slice(0,4), hidden=ids.length-shown.length;
    const circles=shown.map(id=>{ const u=users.find(x=>x.id===id); if(!u) return '';
      return '<span class="coav" data-co="'+u.id+'" data-tip="'+esc(u.name)+'">'+ava(u,28)+'</span>'; }).join('')
      +(hidden>0?'<span class="coav more" data-tip="ещё '+hidden+'">+'+hidden+'</span>':'');
    const rest=users.filter(u=>!co.has(u.id));
    el.innerHTML='<div class="costack">'+circles+(rest.length?'<span class="coadd" id="atCoAdd" data-tip="Добавить соисполнителя">'+ICO.plus+'</span>':'')+'</div>'
      +(rest.length?'<span class="colab" id="atCoLab">Добавить</span>':(ids.length?'':'<span class="colab">нет</span>'));
    el.querySelectorAll('[data-co]').forEach(x=>x.onclick=ev=>{ ev.stopPropagation();
      const u=users.find(z=>z.id===x.dataset.co); if(!u) return; const r=x.getBoundingClientRect();
      showCtx(r.left, r.bottom+6, [{label:ciX()+'Убрать '+esc(u.name), act:()=>{ co.delete(u.id); renderCo(); }}]); });
    const add=e=>{ e.stopPropagation(); pickPerson(document.getElementById('atCoAdd')||el, rest, u=>{ co.add(u.id); renderCo(); }); };
    { const a1=document.getElementById('atCoAdd'), a2=document.getElementById('atCoLab');
      if(a1) a1.onclick=add; if(a2) a2.onclick=add; } }
  renderCo();
  // вложения: файлы копятся локально, зальются после создания
  function renderAt(){ const el=document.getElementById('atAttach'); if(!el) return;
    const tileColor=fn=>{ const m={pdf:'#e5484d',doc:'#3b82f6',docx:'#3b82f6',xls:'#2e9e5b',xlsx:'#2e9e5b',csv:'#2e9e5b',png:'#b45ac9',jpg:'#b45ac9',jpeg:'#b45ac9',zip:'#b08948'}; return m[(String(fn).split('.').pop()||'').toLowerCase()]||'#8a939d'; };
    const extOf=fn=>(String(fn).split('.').pop()||'').toUpperCase().slice(0,4);
    el.innerHTML='<div class="dropzone" id="atUpBtn">'
      +(files.length?'<div class="dz-files">'+files.map((f,i)=>'<div class="ftile" data-fi="'+i+'" title="'+esc(f.name)+' — нажмите, чтобы убрать">'
          +'<span class="ft-b" style="background:'+tileColor(f.name)+'">'+esc(extOf(f.name))+'<b>'+fmtSize(f.size)+'</b></span>'
          +'<span class="ft-n">'+esc(f.name)+'</span></div>').join('')+'</div>':'')
      +'<div class="dz-cta">'+ICO.up+'<b>Загрузить файлы</b>'+(files.length?'':'<span>Можно выбрать несколько файлов или перетащить сюда</span>')+'</div>'
      +'<input type="file" id="atFile" multiple style="display:none"></div>';
    document.getElementById('atUpBtn').onclick=ev=>{ if(ev.target.closest('.ftile')) return; document.getElementById('atFile').click(); };
    document.getElementById('atFile').onchange=ev=>{ for(const f of (ev.target.files||[])){ if(tooBig(f)){ showToast('Слишком большой файл (лимит 50 МБ): '+f.name+' — '+fmtMb(f.size), 8000); continue; } files.push(f); } ev.target.value=''; renderAt(); };
    el.ondragover=ev=>ev.preventDefault(); el.ondrop=ev=>{ ev.preventDefault(); for(const f of (ev.dataTransfer.files||[])){ if(tooBig(f)){ showToast('Слишком большой файл (лимит 50 МБ): '+f.name+' — '+fmtMb(f.size), 8000); continue; } files.push(f); } renderAt(); };
    el.querySelectorAll('[data-fi]').forEach(x=>x.onclick=ev=>{ ev.stopPropagation(); files.splice(+x.dataset.fi,1); renderAt(); }); }
  renderAt();
  document.getElementById('atCancel').onclick=closeModal;
  let creating=false;   // ЗАЩИТА ОТ ДУБЛЕЙ: пока идёт создание (особенно долгая заливка файлов) второй клик игнорируем
  document.getElementById('atOk').onclick=async()=>{
    if(creating) return;
    const nameEl=document.getElementById('atName'), asgEl=document.getElementById('atAssignee');
    const name=nameEl.value.trim(), asg=asgEl.value;
    const dateEl=document.getElementById('atDate'), dateBtn=document.getElementById('atDateBtn')||dateEl;
    const dv=dateEl?dateEl.value:'';
    nameEl.classList.toggle('bad', !name);   // у крупного поля названия нет рамки — подсвечиваем классом
    { const pk=document.getElementById('atAsgPick'); if(pk) pk.style.boxShadow=asg?'':'0 0 0 2px #e5484d'; }   // обязательные: название, ответственный и дата
    if(dateBtn&&dateBtn.style) dateBtn.style.borderColor=dv?'':'#e5484d';
    if(!name||!asg||!dv){   // раньше молчали — человек жал кнопку и не понимал, почему ничего не происходит
      showToast(!name?'Впишите название задачи':(!asg?'Выберите ответственного':'Укажите дату выполнения'));
      (!name?nameEl:dateBtn).focus(); return; }
    const rt=repOn?recType:'none';
    const body={ name,
      due_date:dv,
      due_time:document.getElementById('atTime').value||null,
      assignee_id:asg,
      description:document.getElementById('atDesc').innerHTML,
      recurrence_type:rt,
      recurrence_days: rt==='weekly'?[...recDays]:null,
      recurrence_day_of_month: rt==='monthly'?(parseInt(document.getElementById('atRecDom')&&document.getElementById('atRecDom').value)||null):null,
      recurrence_date: rt==='yearly'?yearlyVal('atRecDate'):null,
      co_assignees:[...co], tag_ids:[...tagSel] };   // сервер создаст их сразу — правами создателя (иначе при делегировании отваливалось 403)
    if(parentId) body.parent_id=parentId;
    const okBtn=document.getElementById('atOk'), cancelBtn=document.getElementById('atCancel');
    creating=true; modalBusy=true; okBtn.disabled=true; if(cancelBtn) cancelBtn.disabled=true;
    okBtn.textContent='Создаю…';
    try{ const d=await api('/api/tasks',{method:'POST',body:JSON.stringify(body)});
      const id=d.task&&d.task.id;
      if(id){
        if(files.length) uploadInBackground(id, files.slice());   // файлы догружаются ФОНОМ: окно закрывается сразу
        pushCreateUndo(body, id); }
      // ⚠️ Подзадача обязана появиться в карточке СРАЗУ: список подзадач приходит отдельным запросом
      //    (/api/tasks/:id/subtasks), общий reload() его не трогает — раньше помогала только перезагрузка
      //    страницы (правка владельца 20.09.2026, п.12).
      if(parentId && typeof _reloadSubsIfOpen==='function') setTimeout(()=>_reloadSubsIfOpen(parentId), 0);
      clearTaskDraft();   // задача создана — черновик отработал
      modalBusy=false; closeModal(); await reload(); }
    catch(e){ showToast('Ошибка: '+e.message); }
    finally{ creating=false; modalBusy=false; const b=document.getElementById('atOk'), c=document.getElementById('atCancel');   // модалка могла закрыться — проверяем элементы
      if(b){ b.disabled=false; b.textContent='Создать задачу'; } if(c) c.disabled=false; } };
}

/* ---------- тумблеры вида (слева) ---------- */
// персистенция вида: масштаб календаря (неделя / 2 недели); неделя всегда открывается текущая
function saveViewState(){ try{ localStorage.setItem('canvas_view', JSON.stringify({ calDays })); }catch(e){} }
function loadViewState(){ let v; try{ v=JSON.parse(localStorage.getItem('canvas_view')||'{}'); }catch(e){ v={}; }
  setBoardH();   // ВСЕГДА: иначе cal.h осталась бы стартовой константой (230), и слоты считались бы от неверной высоты
  if(v.calDays===14){ calDays=14; setCalScale(); const sb=document.getElementById('scaleBtn'); if(sb) sb.textContent='2 недели'; }
}

/* ---------- undo / redo (частые операции: перемещения + правки полей) ---------- */
const undoStack=[], redoStack=[];
function updateUndoBtns(){ const u=document.getElementById('btnUndo'), r=document.getElementById('btnRedo'); if(u) u.disabled=!undoStack.length; if(r) r.disabled=!redoStack.length; }
function pushUndo(undoFn, redoFn){ undoStack.push({undoFn,redoFn}); if(undoStack.length>60) undoStack.shift(); redoStack.length=0; updateUndoBtns(); }
let undoBusy=false;
async function doUndo(){ if(undoBusy||!undoStack.length) return; undoBusy=true; const op=undoStack.pop(); try{ await op.undoFn(); redoStack.push(op); }catch(e){ showToast('Не удалось отменить: '+e.message); } undoBusy=false; updateUndoBtns(); }
async function doRedo(){ if(undoBusy||!redoStack.length) return; undoBusy=true; const op=redoStack.pop(); try{ await op.redoFn(); undoStack.push(op); }catch(e){ showToast('Не удалось повторить: '+e.message); } undoBusy=false; updateUndoBtns(); }
// правка полей задачи с записью в undo (newPatch — что применяем, oldPatch — как вернуть)
async function taskEdit(taskId, newPatch, oldPatch){
  await api('/api/tasks/'+taskId,{method:'PATCH',body:JSON.stringify(newPatch)}); await reload();
  pushUndo(async()=>{ await api('/api/tasks/'+taskId,{method:'PATCH',body:JSON.stringify(oldPatch)}); await reload(); },
           async()=>{ await api('/api/tasks/'+taskId,{method:'PATCH',body:JSON.stringify(newPatch)}); await reload(); });
}
// отмена создания объекта: undo = удалить созданное; redo = создать заново (запоминаем новый id)
function pushCreateUndo(createBody, createdId){
  let curId=createdId;
  pushUndo(async()=>{ await api('/api/tasks/'+curId+'?purge=1',{method:'DELETE'}); await reload(); },   // purge: отменённое создание стирается насовсем, а не оседает в архиве
           async()=>{ const d=await api('/api/tasks',{method:'POST',body:JSON.stringify(createBody)}); curId=d.task.id; await reload(); });
}
document.getElementById('btnUndo').onclick=doUndo;
document.getElementById('btnRedo').onclick=doRedo;
addEventListener('keydown', e=>{ const ae=document.activeElement, tag=(ae&&ae.tagName)||''; if(tag==='INPUT'||tag==='SELECT'||tag==='TEXTAREA'||(ae&&ae.isContentEditable)) return;
  if((e.ctrlKey||e.metaKey) && (e.key==='z'||e.key==='Z')){ e.preventDefault(); e.shiftKey?doRedo():doUndo(); }
  else if((e.ctrlKey||e.metaKey) && (e.key==='y'||e.key==='Y')){ e.preventDefault(); doRedo(); } });

const MOBQ='(max-width:700px)';
function isMobileView(){ return window.matchMedia(MOBQ).matches; }
let mobDay=null;   // abs-день, показываемый на мобиле
function applyMobile(){ const m=isMobileView(); document.body.classList.toggle('mobile', m); if(m){ if(mobDay==null) mobDay=todayAbs(); renderAvaBtnMob(); renderMobile(); } }
function renderAvaBtnMob(){ const b=document.getElementById('mAva'); if(b&&me) b.innerHTML=ava(me,34); }
const WDlong=['Понедельник','Вторник','Среда','Четверг','Пятница','Суббота','Воскресенье'];
function renderMobile(){ if(!isMobileView()) return;
  const d=dateOfAbs(mobDay), wd=(d.getUTCDay()+6)%7, isT=mobDay===todayAbs();
  const dt=document.getElementById('mDate'); if(dt){ dt.className='md'+(isT?' today':''); dt.innerHTML='<div class="dnum">'+d.getUTCDate()+' '+MOc[d.getUTCMonth()]+'</div><div class="dwd">'+WDlong[wd]+(isT?' · сегодня':'')+'</div>'; }
  const tb=document.getElementById('mToday'); if(tb) tb.classList.toggle('show', !isT);   // кнопка «Сегодня» — только когда ушли с текущего дня
  const list=document.getElementById('mList'); if(!list) return;
  const day=allTasks.filter(t=>t.due_date && absOf(t.due_date)===mobDay && !t.archived)
    .sort((a,b)=>{ const at=a.due_time||'', bt=b.due_time||'';   // тот же порядок, что в календаре: время → повторяющиеся → обычные
      if(!!at!==!!bt) return at?-1:1;
      if(at){ if(at!==bt) return at<bt?-1:1; return String(a.name).localeCompare(String(b.name),'ru'); }
      const rk=t=>isRecurring(t)?(isImportant(t)?0:1):(isImportant(t)?2:3);   // тот же порядок, что в календаре
      const ar=rk(a), br=rk(b);
      if(ar!==br) return ar-br;
      return String(a.name).localeCompare(String(b.name),'ru'); });
  list.innerHTML=day.length?day.map(t=>{ const tgcs=tagColorsOf(t), acc=accentOf(t);
    const subMark=t.parent_id?'<svg class="msub" viewBox="0 0 24 24" fill="none" stroke="#98a1ad" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 5v9a3 3 0 0 0 3 3h7.5"/><path d="M14 13.5l3.5 3.5-3.5 3.5"/></svg>':'';
    const tm=t.due_time?String(t.due_time).slice(0,5):'';
    const tc=timePassed(t)?'#e5484d':'#3b82f6';
    return '<div class="mrow" data-tid="'+t.id+'">'
      +(acc?'<i class="macc" style="background:'+acc+'"></i>':'')
      +'<div class="mbody">'
        +((tm||tgcs.length)?('<div class="mtop2">'+(tm?'<span class="mtime" style="color:'+tc+'">'+esc(tm)+'</span>':'<span></span>')
            +'<span class="mdots">'+tgcs.map(c=>'<span class="mdot" style="background:'+c+'"></span>').join('')+'</span></div>'):'')
        +'<div class="mname">'+subMark+esc(t.name)+'</div>'
      +'</div></div>'; }).join('')
    : '<div class="mempty">На этот день задач нет</div>';
  list.querySelectorAll('[data-tid]').forEach(r=>r.onclick=()=>{ const t=allTasks.find(x=>x.id===r.dataset.tid); if(t) openTaskCard(t); });
}

let myTab='open', myQ='', mySort='date', _myT=null;
function tagDots(t){ const c=tagColorsOf(t); return c.length?('<span class="ldots">'+c.map(x=>'<i style="background:'+x+'"></i>').join('')+'</span>'):''; }
const SUBICO='<svg class="lsub" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M7 5v9a3 3 0 0 0 3 3h7.5"/><path d="M14 13.5l3.5 3.5-3.5 3.5"/></svg>';
// Одна строка списка задач: слева дата и время, затем название, сразу за ним метки (ТЗ владельца).
// Значок подзадачи — в самом начале; зелёная галочка появляется только у завершённых.
function taskRow(t, idx, tail){
  const iso=dayISO(t), done=!!t.archived;
  return '<div class="lrow'+(done?' done':'')+'" data-i="'+idx+'" title="Открыть задачу">'
    +(done?'<span class="lmark on">✓</span>':'')
    +'<span class="lsubslot">'+(t.parent_id?SUBICO:'')+'</span>'   // слот есть всегда — иначе дата уезжает вправо у подзадач
    +'<span class="ldate">'+esc(fmtShort(iso))+'</span>'
    +'<span class="ltime">'+(t.due_time?esc(String(t.due_time).slice(0,5)):'')+'</span>'
    +'<span class="lname">'+esc(t.name)+'</span>'
    +tagDots(t)
    +'<span class="lgap"></span>'
    +(tail||'')
   +'</div>';
}
async function renderMyView(){
  // Три вкладки: в работе, архив (ЗАВЕРШЁННЫЕ) и корзина (УДАЛЁННЫЕ). Удалённые в архив не попадают —
  // это разные списки, иначе завершённое и выброшенное лежало бы вперемешку.
  const arch=(myTab==='arch'), trash=(myTab==='trash');
  let list = trash ? ((await api('/api/tasks?deleted=1').catch(()=>({tasks:[]}))).tasks||[])
           : arch  ? ((await api('/api/tasks?archived=1').catch(()=>({tasks:[]}))).tasks||[])
           : (allTasks||[]).slice();
  const q=myQ.trim().toLowerCase();
  if(q) list=list.filter(t=>String(t.name||'').toLowerCase().includes(q));
  list=list.slice().sort((a,b)=> mySort==='name'
    ? String(a.name||'').localeCompare(String(b.name||''),'ru')
    : (dayISO(a)===dayISO(b) ? String(a.due_time||'').localeCompare(String(b.due_time||'')) : (dayISO(a)<dayISO(b)?-1:1)));
  viewHost.innerHTML=
    '<div class="vw-bar">'
     +'<div class="vw-seg"><button data-t="open" class="'+(myTab==='open'?'on':'')+'">В работе</button>'
       +'<button data-t="arch" class="'+(arch?'on':'')+'">Архив</button>'
       +'<button data-t="trash" class="'+(trash?'on':'')+'">Корзина</button></div>'
     +'<label class="srch" style="width:250px">'+ICO.search+'<input id="myQ" placeholder="Поиск по названию…" value="'+esc(myQ)+'" autocomplete="off"></label>'
     +'<div class="vw-sort">Сортировка<select id="mySort"><option value="date"'+(mySort==='date'?' selected':'')+'>по дате</option><option value="name"'+(mySort==='name'?' selected':'')+'>по названию</option></select></div>'
    +'</div>'
    +(list.length? list.map((t,i)=>taskRow(t,i)).join('')

/* ---- МЕТКИ: список по имени, карандаш — правка, крестик — удалить (только администратор) ---- */
let tagEdit=null;   // {id, name, color} — открытый редактор; id==='' — новая метка
async function renderTagsView(){
  const isAdmin=amAdmin();
  if(!isAdmin){ viewHost.innerHTML=''; setView('cal'); return; }   // справочник меток ведёт администратор
  const d=await api('/api/tags').catch(()=>({tags:[]}));
  allTags=d.tags||[];
  const list=allTags.slice().sort((a,b)=>String(a.name||'').localeCompare(String(b.name||''),'ru'));
  const colorOf=k=>(PALETTE[k]||PALETTE.gray).s;
  const editor = tagEdit ? '<div class="tcard2" style="margin:0 0 14px;border-radius:14px">'
      +'<input class="tin" id="tgName" placeholder="Название метки" value="'+esc(tagEdit.name)+'" style="margin-bottom:11px">'
      +'<div style="display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px">'
        +PKEYS.map(k=>'<span class="sw'+(k===tagEdit.color?' on':'')+'" data-c="'+k+'" style="background:'+colorOf(k)+'"></span>').join('')
      +'</div>'
      +'<div style="display:flex;gap:9px"><button class="tbtn dark" id="tgSave" style="height:34px">Сохранить</button><button class="tbtn" id="tgCancel" style="height:34px">Отмена</button></div>'
    +'</div>' : '';
  viewHost.innerHTML='<div class="vw-bar"><div class="vw-h" style="margin:0">МЕТКИ · '+list.length+'</div>'
    +(isAdmin?'<button class="tbtn dark" id="tgNew" style="margin-left:auto;height:36px">'+ICO.plus+'Новая метка</button>':'')+'</div>'
    +editor
    +(list.length?list.map(t=>
      '<div class="tagrow"><span class="tgc" style="background:'+colorOf(t.color_key)+'"></span>'
       +'<span style="flex:1;min-width:0;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(t.name)+'</span>'
       +(isAdmin?'<button class="icobtn" data-ed="'+t.id+'" title="Изменить метку">'+ICO.pencil+'</button>'
                +'<button class="icobtn del" data-del="'+t.id+'" title="Удалить метку">'+ICO.cross+'</button>':'')
      +'</div>').join('')
     :'<div class="lempty">Меток пока нет'+(isAdmin?'':' — их заводит администратор')+'</div>');
  if(isAdmin){
    const nb=document.getElementById('tgNew'); if(nb) nb.onclick=()=>{ tagEdit={id:'',name:'',color:'blue'}; renderTagsView(); };
    viewHost.querySelectorAll('[data-ed]').forEach(b=>b.onclick=()=>{ const t=allTags.find(x=>x.id===b.dataset.ed); if(t){ tagEdit={id:t.id,name:t.name,color:t.color_key||'gray'}; renderTagsView(); } });
    viewHost.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{
      const t=allTags.find(x=>x.id===b.dataset.del); if(!t) return;
      if(!await uiConfirm('Удалить метку «'+t.name+'»? Она пропадёт со всех задач.')) return;
      try{ await api('/api/tags/'+t.id,{method:'DELETE'}); showToast('Метка удалена'); await reload(); }
      catch(e){ showToast('Не удалось удалить: '+e.message); }
      tagEdit=null; renderTagsView();
    });
    if(tagEdit){
      viewHost.querySelectorAll('.sw[data-c]').forEach(sw=>sw.onclick=()=>{ tagEdit.color=sw.dataset.c; tagEdit.name=(document.getElementById('tgName')||{}).value||tagEdit.name; renderTagsView(); });
      document.getElementById('tgCancel').onclick=()=>{ tagEdit=null; renderTagsView(); };
      document.getElementById('tgSave').onclick=async()=>{
        const nm=(document.getElementById('tgName').value||'').trim();
        if(!nm){ showToast('У метки должно быть название'); return; }
        try{
          if(tagEdit.id) await api('/api/tags/'+tagEdit.id,{method:'PATCH',body:JSON.stringify({name:nm,color_key:tagEdit.color})});
          else await api('/api/tags',{method:'POST',body:JSON.stringify({name:nm,color_key:tagEdit.color})});
          tagEdit=null; await reload(); showToast('Сохранено');
        }catch(e){ showToast('Не удалось сохранить: '+e.message); }
        renderTagsView();
      };
    }
  }
}

/* ---- ДЕЛЕГИРОВАННЫЕ: задачи, где я автор; поиск и сортировка по имени и дате ---- */
let dgTab='open', dgQ='', dgSort='date', _dgT=null;
async function renderDelegView(){
  const users=await getUsers();
  const d=await api('/api/tasks/authored?state='+(dgTab==='done'?'done':'open')).catch(()=>({tasks:[]}));
  const uName=id=>{ const u=users.find(x=>x.id===id); return u?u.name:'—'; };
  let list=(d.tasks||[]).map(t=>({o:t,name:t.name,who:uName(t.assignee_id),due:dayISO(t),done:!!t.archived}));
  const q=dgQ.trim().toLowerCase();
  if(q) list=list.filter(i=>(i.name+' '+i.who).toLowerCase().includes(q));
  list=list.slice().sort((a,b)=> dgSort==='name'
    ? String(a.name||'').localeCompare(String(b.name||''),'ru')
    : (String(a.due||'')<String(b.due||'')?-1:1));
  viewHost.innerHTML=
    '<div class="vw-bar">'
     +'<div class="vw-seg"><button data-t="open" class="'+(dgTab==='done'?'':'on')+'">В работе</button><button data-t="done" class="'+(dgTab==='done'?'on':'')+'">Закрытые</button></div>'
     +'<label class="srch" style="width:250px">'+ICO.search+'<input id="dgQ" placeholder="Название или исполнитель…" value="'+esc(dgQ)+'" autocomplete="off"></label>'
     +'<div class="vw-sort">Сортировка<select id="dgSort"><option value="date"'+(dgSort==='date'?' selected':'')+'>по дате</option><option value="name"'+(dgSort==='name'?' selected':'')+'>по названию</option></select></div>'
    +'</div>'
    +(list.length?list.map((i,n)=>taskRow(i.o,n,
        '<span class="lmeta">'+ava(i.o.assignee_id,22)+'<span class="lwho">'+esc(i.who)+'</span></span>')).join('')
     :'<div class="lempty">'+(q?'Ничего не найдено':(dgTab==='done'?'Закрытых поручений нет':'Вы пока никому ничего не поручали'))+'</div>');
  viewHost.querySelectorAll('.vw-seg button').forEach(b=>b.onclick=()=>{ dgTab=b.dataset.t; renderDelegView(); });
  const qi=document.getElementById('dgQ');
  qi.oninput=()=>{ dgQ=qi.value; clearTimeout(_dgT); _dgT=setTimeout(()=>renderDelegView().then(()=>{ const n=document.getElementById('dgQ'); if(n){ n.focus(); n.setSelectionRange(n.value.length,n.value.length); } }),250); };
  document.getElementById('dgSort').onchange=e=>{ dgSort=e.target.value; renderDelegView(); };
  viewHost.querySelectorAll('.lrow[data-i]').forEach(r=>r.onclick=async()=>{
    const it=list[+r.dataset.i]; if(!it) return;
    let full=(allTasks||[]).find(z=>z.id===it.o.id);
    if(!full){ const one=await api('/api/tasks/'+it.o.id).catch(()=>null); full=one&&one.task; }
    if(full) openTaskCard(full);
    else showToast('Эту задачу ведёт '+it.who+' — карточка доступна только ответственному и соисполнителям', 5000);
  });
}

/* ---------- ПОИСК активных задач (панель справа, тот же принцип, что архив) ---------- */

    +(list.length?list.map((i,n)=>taskRow(i.o,n)).join('')
     :'<div class="lempty">'+(q?'Ничего не найдено':'Наберите, что ищете')+'</div>');

  searchBody.querySelectorAll('.lrow[data-i]').forEach(r=>r.onclick=()=>{ const it=list[+r.dataset.i]; if(!it) return; closeSearch();   // закрываем поиск, открываем карточку (без наложения панелей)

/* ---------- профиль пользователя и управление пользователями (⚙) ---------- */
const ROLE_RU={admin:'администратор',manager:'менеджер',member:'сотрудник',viewer:'наблюдатель'};
async function uploadAvatar(userId, file){ if(!file) return false;
  if(!/^image\//.test(file.type)){ showToast('Нужен файл изображения'); return false; }
  const fd=new FormData(); fd.append('file',file);
  try{ const r=await fetch(API+'/api/users/'+userId+'/avatar',{method:'POST',headers:{Authorization:'Bearer '+token},body:fd}); if(!r.ok){ const e=await r.json().catch(()=>({})); throw new Error(e.error||('HTTP '+r.status)); } usersCache=null; return true; }
  catch(e){ showToast('Ошибка загрузки: '+e.message); return false; }
}
// карточка своего профиля (или любого — для админа): имя, пароль, аватар
async function openProfileCard(userId){
  const users=await getUsers(); const u=users.find(x=>x.id===userId)||me; if(!u) return;
  if(!amAdmin() && !(me&&u.id===me.id)) return;   // чужую карточку сотруднику не открываем: там логин и доступ
  const canEdit=me&&(me.role==='admin'||me.id===u.id);
  const isAdmin=amAdmin();   // админ может менять логин и роль пользователей
  const selfProfile=!!(me&&u.id===me.id);   // значок задач — личная настройка браузера, показываем только в своём профиле
  const row=(icon,label,inner)=>'<div class="trow2"><div class="tlab">'+ic(icon)+'<span>'+label+'</span></div><div>'+inner+'</div></div>';
  dlg.classList.add('dlg2');
  dlg.innerHTML='<h3 style="margin:0 0 16px;font-size:16px">Профиль</h3>'
   +'<div style="display:flex;align-items:center;gap:14px;margin-bottom:12px"><span id="pfAva">'+ava(u,64)+'</span>'+(canEdit?'<button class="tbtn" id="pfAvaBtn">Загрузить свою</button><input type="file" id="pfAvaFile" accept="image/*" style="display:none">':'')+'</div>'
   +(canEdit?('<div style="font-size:12.5px;color:var(--muted);margin-bottom:7px">Или выберите готовую</div>'
     +'<div class="avapick" id="pfPick">'+Array.from({length:AVA_COUNT},(_,i)=>
        '<button class="ap'+((u.avatar_no===i&&!u.avatar_key)?' on':'')+'" data-av="'+i+'" title="Аватарка '+(i+1)+'">'+avaBuilt(i,34)+'</button>').join('')+'</div>'):'')
   +row('user','Имя','<input class="tin" id="pfName" value="'+esc(u.name)+'"'+(canEdit?'':' disabled')+'>')
   +row('doc','Логин','<input class="tin" id="pfEmail" value="'+esc(u.email||'')+'"'+(isAdmin?'':' disabled')+'>')
   +(isAdmin?row('flag','Роль','<select class="tin" id="pfRole"'+(selfProfile?' disabled title="Свою роль изменить нельзя"':'')+'>'
       +ROLE2.map(([v,l])=>'<option value="'+v+'"'+(roleOf(u.role)===v?' selected':'')+'>'+l+'</option>').join('')+'</select>'
       +(selfProfile?'<div style="font-size:11px;color:var(--muted);margin-top:4px">Свою роль изменить нельзя</div>':'')):'')
   +(canEdit?row('flag','Новый пароль','<input class="tin" id="pfPass" type="text" placeholder="оставьте пустым — не менять" autocomplete="new-password">'):'')
   +(selfProfile?row('user','Телеграм','<div id="pfTg"><span style="font-size:12.5px;color:var(--muted)">проверяем…</span></div>'):'')
   +'<div style="display:flex;align-items:center;gap:9px;margin-top:14px;padding-top:12px;border-top:1px solid #e9edf3">'
     +(selfProfile?'<button class="tbtn" id="pfLogout" style="color:#e5484d">🚪 Выйти</button>':'')
     +'<span style="flex:1"></span><button class="tbtn" id="pfCancel">Закрыть</button>'+(canEdit?'<button class="tbtn blue" id="pfOk">Сохранить</button>':'')+'</div>';
  modal.classList.add('show');
  { const lo=document.getElementById('pfLogout'); if(lo) lo.onclick=()=>{ closeModal(); logout('', true); }; }   // сам нажал «Выйти» → гасим и резервную куку
  // ⚠️ Выбранная картинка — это ЧЕРНОВИК до нажатия «Сохранить» (правка владельца 20.09.2026).
  //    Сразу меняется только предпросмотр вверху карточки; в базу уходит вместе с именем и паролем.
  let pickNo=(u.avatar_key?null:(u.avatar_no!=null?u.avatar_no:null));
  document.querySelectorAll('#pfPick .ap').forEach(b2=>b2.onclick=()=>{
    pickNo=+b2.dataset.av;
    document.querySelectorAll('#pfPick .ap').forEach(x=>x.classList.toggle('on', +x.dataset.av===pickNo));
    const box=document.getElementById('pfAva');
    if(box) box.innerHTML=avaBuilt(pickNo,64);   // предпросмотр: показываем выбранную, фотография уступает ей после сохранения
  });
  const avaBtn=document.getElementById('pfAvaBtn');
  if(avaBtn){ avaBtn.onclick=()=>document.getElementById('pfAvaFile').click();
    document.getElementById('pfAvaFile').onchange=async ev=>{
      if(!await uploadAvatar(u.id, ev.target.files&&ev.target.files[0])) return;
      usersCache=null;                                     // новый avatar_key — иначе везде останется старый адрес картинки
      const fresh=(await getUsers()).find(x=>x.id===u.id);
      document.getElementById('pfAva').innerHTML=ava(fresh,64);
      if(u.id===(me&&me.id)){ if(fresh) me.avatar_key=fresh.avatar_key; renderAvaBtn(); refreshMe(); }
      try{ refreshView(); }catch(e){}                       // список «Команда» и прочие открытые виды
      if(typeof _rerenderCardAvatars==='function') _rerenderCardAvatars();
    }; }
  // Телеграм: показываем связку или выдаём код привязки. Код живёт 10 минут, пароль в переписке не звучит.
  if(selfProfile) (async function renderTg(){
    const box=document.getElementById('pfTg'); if(!box) return;
    let link=null;
    try{ link=(await api('/api/agent/link')).link; }catch(e){ box.innerHTML='<span style="font-size:12.5px;color:var(--muted)">не удалось проверить</span>'; return; }
    if(link){
      box.innerHTML='<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap"><span style="font-size:13px">подключён'+(link.username?' · @'+esc(link.username):'')+'</span>'
        +'<button class="tbtn" id="pfTgOff" style="height:30px">Отключить</button></div>';
      document.getElementById('pfTgOff').onclick=async()=>{ try{ await api('/api/agent/link',{method:'DELETE'}); renderTg(); }catch(e){ showToast('Ошибка: '+e.message); } };
      return;
    }
    box.innerHTML='<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap"><button class="tbtn" id="pfTgOn" style="height:30px">Подключить телеграм</button>'
      +'<span style="font-size:11.5px;color:var(--muted)">чтобы ставить задачи и спрашивать о них прямо в переписке с ботом</span></div>';
    document.getElementById('pfTgOn').onclick=async()=>{
      try{ const d=await api('/api/agent/code',{method:'POST'});
        box.innerHTML='<div style="font-size:13px">Отправьте боту этот код: <b style="font-size:19px;letter-spacing:.12em">'+esc(d.code)+'</b></div>'
          +'<div style="font-size:11.5px;color:var(--muted);margin-top:4px">Код живёт '+d.expires_in_min+' минут. Откройте бота в Телеграме и пришлите ему эти шесть цифр.</div>';
      }catch(e){ showToast('Ошибка: '+e.message); }
    };
  })();
  document.getElementById('pfCancel').onclick=closeModal;
  const ok=document.getElementById('pfOk');
  if(ok) ok.onclick=async()=>{
    const body={}; const nm=document.getElementById('pfName').value.trim(); if(nm&&nm!==u.name) body.name=nm;
    const pw=document.getElementById('pfPass').value; if(pw) body.password=pw;
    const emEl=document.getElementById('pfEmail'); if(emEl && !emEl.disabled){ const em=emEl.value.trim().toLowerCase(); if(em && em!==u.email) body.email=em; }   // логин
    if(pickNo!=null && (pickNo!==u.avatar_no || u.avatar_key)) body.avatar_no=pickNo;   // выбранная в этой карточке готовая аватарка
    { const rl=document.getElementById('pfRole'); if(rl && !rl.disabled && rl.value!==u.role) body.role=rl.value; }   // роль меняет только администратор и не себе
    if(latinBad(body.email)||latinBad(body.password)){ showToast('Логин и пароль — только латиница, цифры и знаки. Русские буквы нельзя.', 6000); return; }
    if(!Object.keys(body).length){ closeModal(); return; }
    try{ await api('/api/users/'+u.id,{method:'PATCH',body:JSON.stringify(body)}); usersCache=null; closeModal(); if(u.id===(me&&me.id)) refreshMe(); await reload(); }
    catch(e){ showToast('Ошибка: '+e.message); }
  };
}
async function refreshMe(){ try{ const d=await api('/api/auth/me'); me=d.user; usersCache=null; renderAvaBtn(); }catch(e){} }
// админ-панель: список пользователей, блокировка, создание, редактирование
// Новый сотрудник — из вкладки «Команда» (отдельного списка пользователей нет: он и есть «Команда»).
// Вид — один в один с карточкой сотрудника: аватар, имя, логин, пароль. Роли в интерфейсе нет.
async function openCreateUserCard(){
  if(!me||me.role!=='admin') return;
  dlg.classList.add('dlg2');
  const row=(icon,label,inner)=>'<div class="trow2"><div class="tlab">'+ic(icon)+'<span>'+label+'</span></div><div>'+inner+'</div></div>';
  let avaFile=null;
  dlg.innerHTML='<h3 style="margin:0 0 16px;font-size:16px">Новый сотрудник</h3>'
   +'<div style="display:flex;align-items:center;gap:14px;margin-bottom:14px"><span id="cuAva">'+avaHtml('',64)+'</span>'
     +'<button class="tbtn" id="cuAvaBtn">Выбрать аватар</button><input type="file" id="cuAvaFile" accept="image/*" style="display:none"></div>'
   +row('user','Имя','<input class="tin" id="cuName" placeholder="Имя сотрудника">')
   +row('doc','Логин','<input class="tin" id="cuEmail" placeholder="логин" autocomplete="off">')
   +row('flag','Пароль','<input class="tin" id="cuPass" type="text" placeholder="пароль">')
   +row('flag','Роль','<select class="tin" id="cuRole">'+ROLE2.map(([v,l])=>'<option value="'+v+'"'+(v==='member'?' selected':'')+'>'+l+'</option>').join('')+'</select>')
   +'<div style="display:flex;justify-content:flex-end;gap:9px;margin-top:14px;padding-top:12px;border-top:1px solid #eef0f4"><button class="tbtn" id="cuBack">Закрыть</button><button class="tbtn blue" id="cuOk">Сохранить</button></div>';
  modal.classList.add('show');
  setTimeout(()=>{ const i=document.getElementById('cuName'); if(i) i.focus(); },60);
  // аватар выбирают ДО создания: файл держим в памяти и заливаем сразу после того, как сотрудник появился
  document.getElementById('cuAvaBtn').onclick=()=>document.getElementById('cuAvaFile').click();
  document.getElementById('cuAvaFile').onchange=ev=>{ const f=ev.target.files&&ev.target.files[0]; if(!f) return;
    if(!/^image\//.test(f.type)){ showToast('Нужен файл изображения'); return; }
    if(f.size>3*1024*1024){ showToast('Аватар до 3 МБ'); return; }
    avaFile=f; const r=new FileReader();
    r.onload=()=>{ document.getElementById('cuAva').innerHTML='<img class="tava" src="'+r.result+'" style="width:64px;height:64px;border-radius:50%;object-fit:cover">'; };
    r.readAsDataURL(f); };
  document.getElementById('cuBack').onclick=closeModal;
  document.getElementById('cuOk').onclick=async()=>{
    const name=document.getElementById('cuName').value.trim(), email=document.getElementById('cuEmail').value.trim(),
          password=document.getElementById('cuPass').value;
    ['cuName','cuEmail','cuPass'].forEach(id=>{ const el=document.getElementById(id); el.style.borderColor=el.value.trim()?'':'#e5484d'; });
    if(!name||!email||!password){ showToast('Заполните имя, логин и пароль'); return; }
    if(latinBad(email)||latinBad(password)){ showToast('Логин и пароль — только латиница, цифры и знаки. Русские буквы нельзя.', 6000);
      ['cuEmail','cuPass'].forEach(id=>{ const el=document.getElementById(id); if(latinBad(el.value.trim())) el.style.borderColor='#e5484d'; }); return; }
    try{
      const role=(document.getElementById('cuRole')||{}).value||'member';
      const d=await api('/api/users',{method:'POST',body:JSON.stringify({name,email,password,role})});
      const nid=d.user&&d.user.id;
      if(nid&&avaFile) await uploadAvatar(nid, avaFile);
      usersCache=null; closeModal(); showToast('Сотрудник добавлен'); refreshView();
    }
    catch(e){ showToast('Не удалось: '+e.message); }
  };
}

/* ---------- data load ---------- */
async function reload(){
  const [tk, tg] = await Promise.all([api('/api/tasks'), api('/api/tags').catch(()=>({tags:[]}))]);
  allTags = tg.tags||[];
  allTasks = tk.tasks;   // API отдаёт только свои задачи — где ты ответственный или соисполнитель
  computeSlots();
  wakeDraw();   // данные поменялись — рисуем сразу, не дожидаясь редкого кадра покоя
  liveSig = sigFrom(allTasks);   // базовая «подпись» данных для живого обновления
  if(isMobileView()) renderMobile();       // мобильная версия — обновить список дня
  try{ refreshView(); }catch(e){}          // открыт список меню (мои задачи и т.п.) — перерисовать и его
  rolloverOverdue();   // при каждом заходе/обновлении переносим просроченные на сегодня (guard внутри против рекурсии)
}
// ---------- живое обновление: тихий опрос чужих изменений (без перезахода) ----------
function sigFrom(taskArr){ return JSON.stringify(
  taskArr.map(t=>[t.id,t.name,t.assignee_id||'',t.due_date||'',t.due_time||'',!!t.archived,(t.co_assignees||[]).join(','),(t.tags||[]).join(',')])
); }
let liveSig=null, _pollBusy=false, _ws=null, _wsTimer=null;
// WebSocket: сервер шлёт {type:'change'} при любой мутации → сразу подтягиваем (мгновенно, миллисекунды)
function connectLive(){
  try{ if(!token) return;   // без сессии канал не нужен — и сервер его не откроет
    const base=API||location.origin; const url=base.replace(/^http/,'ws')+'/ws?tk='+encodeURIComponent(token);
    _ws=new WebSocket(url);
    _ws.onmessage=ev=>{ let d={}; try{ d=JSON.parse(ev.data); }catch(e){} if(d.type==='change'){ _pendingChange=true; pollUpdates(); } };   // сигнал ЗАПОМИНАЕМ: если сейчас нельзя обновиться (открыта карточка, вкладка в фоне) — применим позже
    _ws.onclose=()=>{ _ws=null; if(!_wsTimer) _wsTimer=setTimeout(()=>{ _wsTimer=null; connectLive(); }, 4000); };   // авто-переподключение
    _ws.onerror=()=>{ try{ _ws.close(); }catch(e){} };
  }catch(e){ if(!_wsTimer) _wsTimer=setTimeout(()=>{ _wsTimer=null; connectLive(); }, 4000); }
}
// Изменение НЕ теряется: если применить прямо сейчас нельзя (вкладка в фоне, открыта карточка, идёт перетаскивание),
// флаг _pendingChange остаётся, и мы подтягиваем данные сразу, как только помеха ушла.
// Раньше сигнал в такой момент просто выбрасывался, и правки коллег «доезжали» через 20 сек или вообще после F5.
let _pendingChange=false;
function liveResume(){ if(_pendingChange) pollUpdates(); }
addEventListener('visibilitychange', ()=>{ if(!document.hidden) liveResume(); });   // вернулись на вкладку — сразу подтянуть
addEventListener('focus', liveResume);
async function pollUpdates(){
  if(_pollBusy) return;
  if(document.hidden) return;                                          // вкладка в фоне — ждём возвращения (флаг сохранится)
  if(down||moved) return;                       // не мешаем перетаскиванию/рамке
  if(modal.classList.contains('show')||taskSide.classList.contains('show')) return;   // открыта карточка/модалка — не дёргаем поле под руками
  _pollBusy=true;
  try{ const tk=await api('/api/tasks');
    const sig=sigFrom(tk.tasks||[]);
    if(liveSig!==null && sig!==liveSig){ await reload(); }   // у кого-то что-то поменялось → подтягиваем (reload сам обновит liveSig)
    else if(liveSig===null) liveSig=sig;
    _pendingChange=false;
  }catch(e){}
  _pollBusy=false;
}

const scaleBtn=document.getElementById('scaleBtn');
scaleBtn.onclick=()=>{ calDays = calDays===7?14:7; setCalScale();   // масштаб таймлайна: неделя / 2 недели (месяц убран)
  scaleBtn.textContent=(calDays===7?'Неделя':'2 недели'); saveViewState(); };
document.getElementById('todayBtn').onclick=()=>{ dayScrollTarget=mondayAbs(); };   // плавный возврат к текущей неделе
// перенос ГРУППЫ карточек на другой день: одним заходом, с общей отменой (Ctrl+Z)
async function rescheduleMany(list, iso){
  const items=list.filter(t=>t&&t.id).map(t=>({id:t.id, old:t.due_date?String(t.due_date).slice(0,10):null}));
  if(!items.length) return;
  for(const t of list) t.due_date=iso;   // оптимистично: карточки сразу встают в новый день
  computeSlots(); clearCardSel();
  const put=async(id,val)=>{ try{ await api('/api/tasks/'+id,{method:'PATCH',body:JSON.stringify({due_date:val})}); }catch(e){ showToast('Ошибка: '+e.message); } };
  for(const it of items) await put(it.id, iso);
  await reload();
  showToast('Перенесено задач: '+items.length, 2500);
  pushUndo(async()=>{ for(const it of items) await put(it.id, it.old); await reload(); },
           async()=>{ for(const it of items) await put(it.id, iso); await reload(); });
}
async function rescheduleTask(t, iso){ const old=t.due_date?String(t.due_date).slice(0,10):null;
  t.due_date=iso; computeSlots();   // оптимистично: карточка сразу встаёт на новый день (без задержки/рывка после сети)
  try{ await taskEdit(t.id, {due_date:iso}, {due_date:old}); }
  catch(e){ t.due_date=old; computeSlots(); showToast('Ошибка: '+e.message); } }   // сеть упала — откатываем

// автоперенос: незавершённые задачи с прошедшей датой переезжают на сегодня (при загрузке и в 00:00).
// дату можно вручную поставить на вчера — но при смене суток она переедет на новый день.
// ⚠️ ДЕЛАЕТ СЕРВЕР, одним запросом. Раньше это делал браузер: шёл по СВОЕМУ списку задач в памяти
// и патчил каждую дату отдельно. Если список устарел (телефон спал сутками, проснулся, сеть ещё
// не поднялась, а таймер смены суток уже сработал) — перенос затирал свежие даты, и задачи,
// отложенные на будущее с другого устройства, возвращались на сегодня (
// десять задач). Теперь браузер не решает, ЧТО переносить, — он только просит сервер это сделать,
// Дату браузер НЕ присылает: сутки считает сервер по московскому времени (см. комментарий
// у обработчика в api/src/crud.ts) — иначе устройство с неверными часами увозило бы чужие сроки.
let _todaySeen = todayAbs(), _rollBusy=false;
async function rolloverOverdue(){
  if(_rollBusy) return;   // защита от рекурсии: rolloverOverdue зовёт reload(), а reload() зовёт rolloverOverdue()
  _rollBusy=true;
  try{
    const r = await api('/api/tasks/rollover', {method:'POST', body:'{}'});
    if(r && r.moved) await reload();   // что-то переехало — показываем новое состояние
    return true;
  }
  catch(e){ return false; }   // связи нет — молчим: это фон, а не действие человека; вернём false, чтобы попробовать ещё раз
  finally{ _rollBusy=false; }
}

// Проверка сессии при запуске. КЛЮЧЕВОЕ: сетевой сбой — НЕ повод разлогинивать.
// Раньше здесь (и в catch у start()) любая ошибка сносила токен: телефон просыпается, сеть ещё не поднялась,
// первый же запрос падает → человека выбрасывало на экран входа с требованием пароля «на ровном месте».
// Теперь разлогинивает ТОЛЬКО честный 401 (это делает сам api()), а связь мы терпеливо ждём.
const AUTH_TRIES=40;   // ~10 минут терпения: дольше любого «телефон проснулся, сеть ещё не поднялась»
async function authMeResilient(){
  for(let a=1;a<=AUTH_TRIES;a++){
    try{ return await api('/api/auth/me'); }
    catch(e){
      if(String(e&&e.message)==='unauthorized') return null;   // сессия действительно недействительна — api() уже показал вход
      showToast('Нет связи с сервером — жду и пробую снова…', 2500);
      await new Promise(z=>setTimeout(z, Math.min(15000, 1500*a)));   // ждём дольше с каждой попыткой, но не сдаёмся
    }
  }
  // связи нет очень долго — показываем вход с ЧЕСТНОЙ причиной (пароль тут ни при чём) и не трогаем сохранённый токен:
  // как только связь появится, обычная перезагрузка вернёт сессию без пароля
  loginEl.classList.remove('hidden'); prefillLogin();
  const el=document.getElementById('lErr');
  if(el){ el.textContent='Не удаётся связаться с сервером. Проверьте интернет и обновите страницу — пароль вводить не нужно.'; el.style.color='var(--muted)'; }
  return null;
}
async function start(){
  const myTok = token;   // сессия этого запуска
  const d = await authMeResilient();
  if(!d) return;                    // недействительная сессия — экран входа уже показан
  if(token!==myTok) return;         // нас обогнал более свежий вход — тихо выходим (иначе моргание/двойной старт)
  me=d.user;
  try{ if(me&&me.email) localStorage.setItem('canvas_email', me.email); }catch(e){}
  if(_sessionTok===myTok) return;   // приложение уже поднято под этот токен — не дублируем интервалы/WS/поллинг
  _sessionTok=myTok;
  // ПРОДЛЕНИЕ СЕССИИ: сервер отдал свежий токен на полный срок — сохраняем. Пока человек заходит хотя бы
  // раз в 90 дней, срок жизни токена до него уже не доберётся (раньше выкидывало ровно через 7 дней всех).
  if(d.token && d.token!==token){ token=d.token; _sessionTok=token; try{ localStorage.setItem('canvas_token', token); }catch(e){} }
  renderAvaBtn();
  applyRole();       // админские разделы меню — только администратору
  applyMySettings();   // ширина карточки задачи — из учётной записи, а не из браузера
  applyUiDensity();   // плотность доски под ширину экрана; меняет слот/шапку до первой отрисовки
  loadViewState();   // восстановить тумблеры/высоту/масштаб из прошлой сессии
  frameCalOnStart();   // календарь обрамляем ДО загрузки данных: reload() — это сетевые запросы, и всё это время
                       // мелькал бы неверный вид. Геометрия доски от данных не зависит, обрамлять можно сразу.
  await reload();
  applyMobile();     // включить мобильный режим на узком экране
  await rolloverOverdue();
  // смена суток (00:00) → просроченные на новый день. ⚠️ Отметку «эти сутки отработаны» ставим
  // ТОЛЬКО после удачного ответа сервера: если в полночь не было связи, попытка повторится
  // через 30 секунд, а не пропадёт до следующего захода.
  setInterval(async ()=>{ const d=todayAbs(); if(d!==_todaySeen){ if(await rolloverOverdue()) _todaySeen=d; } }, 30000);
  connectLive();                    // мгновенное живое обновление по WebSocket
  setInterval(pollUpdates, 7000);   // страховка на случай обрыва WS (и она же добирает пропущенные сигналы)
}

// ЗАГРУЗКА. Есть токен — стартуем. Токена нет — пробуем восстановить сессию по резервной куке
// (мобильный Safari чистит localStorage у сайтов, куда не заходили неделю: токен пропадает, кука живёт).
// start() НЕ оборачиваем в catch(logout): случайная ошибка не должна стоить человеку пароля —
// разлогинивает только честный 401 внутри api().
prefillLogin();
if(token){ loginEl.classList.add('hidden');
  // Вид выставляем ДО проверки сессии (это ещё один сетевой запрос): геометрия доски и плотность
  // не зависят ни от данных, ни от пользователя — значит первый же кадр можно рисовать правильным.
  try{ applyUiDensity(); loadViewState(); frameCalOnStart(); }catch(e){}
  start().catch(e=>console.error('start', e)); }
else{
  (async()=>{
    try{
      const r=await fetch(API+'/api/auth/me',{credentials:'include',cache:'no-store'});
      if(!r.ok) throw new Error('no session');
      const d=await r.json();
      if(!d||!d.token) throw new Error('no session');
      token=d.token; try{ localStorage.setItem('canvas_token', token); }catch(e){}
      loginEl.classList.add('hidden');
      await start();
    }catch(e){ loginEl.classList.remove('hidden'); prefillLogin(); }
  })();
}
try{ document.body.classList.add('booting');
  setTimeout(()=>{ document.body.classList.remove('booting'); document.documentElement.classList.remove('booting-cal'); }, 1500);
}catch(e){}   // страховка: даже при сбое запуска полотно покажется
requestAnimationFrame(draw);
</script>
